<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget — suivi de comptes et objectif de revenu</title>
<style>
/* ============================================================
   1. THEME — toutes les couleurs sont pilotees par ces variables,
      elles-memes ecrites par l'editeur d'apparence (onglet Reglages).
   ============================================================ */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eef0f4; --surface3:#e4e7ee;
  --text:#1b1f2a; --muted:#6b7280; --border:#d8dce4;
  --accent:#3d6df0; --accent-fg:#ffffff; --accent-soft:#e6ecfe;
  --pos:#1c9c68; --neg:#d64545; --warn:#c98a12; --info:#3f7fb8;
  --radius:10px; --gap:16px; --pad:16px; --fs:14px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --c1:#3d6df0; --c2:#1c9c68; --c3:#e0952a; --c4:#b45bd6; --c5:#d64545;
  --c6:#2aa3b8; --c7:#7a86f0; --c8:#8a9a3d; --c9:#d67a9c; --c10:#6b7280;
}
html[data-dark="1"]{
  --bg:#12151c; --surface:#1a1e27; --surface2:#222733; --surface3:#2c323f;
  --text:#e8eaf0; --muted:#9aa3b2; --border:#333a48;
  --accent:#6b93ff; --accent-fg:#0b0e14; --accent-soft:#1e2a45;
  --pos:#3ecf8e; --neg:#f2726f; --warn:#e5b13a; --info:#63b3ed;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --c1:#6b93ff; --c2:#3ecf8e; --c3:#e5b13a; --c4:#c88ae8; --c5:#f2726f;
  --c6:#4fc5db; --c7:#9aa3ff; --c8:#a9bd52; --c9:#eb9ab8; --c10:#9aa3b2;
}
html[data-density="compact"]{ --gap:10px; --pad:10px; --fs:13px; }
html[data-density="large"]{ --gap:22px; --pad:22px; --fs:15px; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 var(--font);
     -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1rem} h4{font-size:.9rem}
a{color:var(--accent)}
small,.muted{color:var(--muted)}
.hide{display:none!important}
[hidden]{display:none!important}   /* sinon .app{display:grid} l'emporte sur l'attribut hidden */

/* ============================================================
   2. COQUE — barre de navigation repositionnable (gauche/droite/haut)
   ============================================================ */
.app{display:grid;min-height:100vh}
.app[data-nav="left"]{grid-template-columns:232px 1fr;grid-template-areas:"nav main"}
.app[data-nav="right"]{grid-template-columns:1fr 232px;grid-template-areas:"main nav"}
.app[data-nav="top"]{grid-template-rows:auto 1fr;grid-template-areas:"nav" "main"}
nav.side{grid-area:nav;background:var(--surface);border-right:1px solid var(--border);
  padding:var(--pad);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;
  height:100vh;overflow:auto}
.app[data-nav="right"] nav.side{border-right:0;border-left:1px solid var(--border)}
.app[data-nav="top"] nav.side{height:auto;position:sticky;flex-direction:row;flex-wrap:wrap;
  align-items:center;border:0;border-bottom:1px solid var(--border);overflow:visible}
main{grid-area:main;padding:var(--pad);max-width:1500px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;
  padding:6px 8px 14px}
.app[data-nav="top"] .brand{padding:6px 12px 6px 4px}
.brand .dot{width:12px;height:12px;border-radius:4px;background:var(--accent)}
nav.side button.tab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--text);padding:8px 10px;border-radius:var(--radius);
  cursor:pointer;font:inherit}
.app[data-nav="top"] nav.side button.tab{width:auto}
nav.side button.tab:hover{background:var(--surface2)}
nav.side button.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .spacer{flex:1}
.app[data-nav="top"] nav.side .spacer{flex:1}
.badge{margin-left:auto;background:var(--neg);color:#fff;border-radius:999px;
  padding:0 7px;font-size:11px;font-weight:700;line-height:18px;min-width:18px;text-align:center}
.app[data-nav="top"] .badge{margin-left:4px}

/* ============================================================
   3. COMPOSANTS
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--pad);box-shadow:var(--shadow)}
.card>h3{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card>h3 .grip{cursor:grab;color:var(--muted);user-select:none;font-size:15px;line-height:1}
.row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}
.row.tight{gap:8px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.sep{height:1px;background:var(--border);margin:12px 0}

button,.btn{font:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{background:var(--surface3)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:none;border-color:transparent}
button.ghost:hover{background:var(--surface2)}
button.danger{color:var(--neg);border-color:var(--border)}
button.danger:hover{background:var(--neg);color:#fff;border-color:var(--neg)}
button.sm{padding:3px 8px;font-size:.85em}
button:disabled{opacity:.45;cursor:not-allowed}

input,select,textarea{font:inherit;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[type=color]{padding:2px;height:34px;cursor:pointer}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.86em;color:var(--muted);min-width:0}
label.f>span{font-weight:600}
label.inline{display:inline-flex;flex-direction:row;align-items:center;gap:7px;color:var(--text);font-size:1em}
fieldset{border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:0}
legend{font-weight:650;padding:0 6px;font-size:.9em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

table{width:100%;border-collapse:collapse;font-size:.95em}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-weight:650;color:var(--muted);font-size:.85em;text-transform:uppercase;letter-spacing:.03em;
   white-space:nowrap;cursor:pointer;user-select:none}
th.nosort{cursor:default}
tbody tr:hover{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);
  border:1px solid var(--border);border-radius:999px;padding:1px 9px;font-size:.82em;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78em;font-weight:600}
.pill.rev{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.pill.dep{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.pill.vir{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}

.stat{background:var(--surface2);border-radius:var(--radius);padding:12px 14px}
.stat .k{color:var(--muted);font-size:.8em;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s{font-size:.82em;color:var(--muted)}

.bar{height:9px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92em}
.note.info{border-color:var(--info);background:color-mix(in srgb,var(--info) 9%,transparent)}
.note.bad{border-color:var(--neg);background:color-mix(in srgb,var(--neg) 9%,transparent)}
.note.good{border-color:var(--pos);background:color-mix(in srgb,var(--pos) 9%,transparent)}

/* Grille du tableau de bord : blocs deplacables */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);align-items:start}
.blk{grid-column:span 6}
.blk[data-span="4"]{grid-column:span 4} .blk[data-span="6"]{grid-column:span 6}
.blk[data-span="8"]{grid-column:span 8} .blk[data-span="12"]{grid-column:span 12}
.blk[data-span="3"]{grid-column:span 3}
.blk.dragging{opacity:.4}
.blk.over{outline:2px dashed var(--accent);outline-offset:3px}
@media(max-width:900px){ .blk,.blk[data-span]{grid-column:span 12} }

/* Zone de depot CSV */
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:34px;text-align:center;
  color:var(--muted);background:var(--surface2);transition:.15s}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Modale */
.modal{position:fixed;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:60}
.modal>.box{background:var(--surface);border-radius:12px;border:1px solid var(--border);
  max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal>.box.wide{max-width:1050px}
.modal .head{display:flex;align-items:center;gap:10px;padding:14px var(--pad);
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal .head h3{margin:0;flex:1}
.modal .body{padding:var(--pad);display:flex;flex-direction:column;gap:12px}
.modal .foot{padding:12px var(--pad);border-top:1px solid var(--border);display:flex;
  gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}

/* Toast */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;
  box-shadow:var(--shadow);font-size:.9em;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

svg .gridline{stroke:var(--border);stroke-width:1}
svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg text.val{fill:var(--text);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85em;margin-top:8px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:var(--gap);
  flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:8px 12px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}

.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.85em}

.wf-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:5px 0;border-bottom:1px dotted var(--border)}
.wf-row.total{border-top:2px solid var(--text);border-bottom:0;font-weight:700;margin-top:4px;padding-top:8px}
.wf-row .lbl{display:flex;align-items:center;gap:8px}
.wf-row .amt{font-variant-numeric:tabular-nums;white-space:nowrap}

@media print{
  nav.side,.noprint{display:none!important}
  .app{display:block} body{background:#fff}
  .card{break-inside:avoid;box-shadow:none;border-color:#bbb}
}
</style>
</head>
<body>
<div id="lock" class="modal hide">
  <div class="box" style="max-width:420px">
    <div class="head"><h3>Données verrouillées</h3></div>
    <div class="body">
      <p class="muted" style="margin:0">Ce fichier contient des données chiffrées. Saisis ton mot de passe pour les déverrouiller.</p>
      <label class="f"><span>Mot de passe</span><input id="lockPwd" type="password" autofocus></label>
      <div id="lockErr" class="note bad hide">Mot de passe incorrect.</div>
    </div>
    <div class="foot">
      <button id="lockReset" class="danger">Tout effacer</button>
      <button id="lockGo" class="primary">Déverrouiller</button>
    </div>
  </div>
</div>

<div class="app" id="app" data-nav="left" hidden>
  <nav class="side" id="nav">
    <div class="brand"><span class="dot"></span><span>Budget</span></div>
    <button class="tab" data-view="dash">📊 <span>Tableau de bord</span></button>
    <button class="tab" data-view="tx">📒 <span>Transactions</span></button>
    <button class="tab" data-view="review">🔎 <span>À valider</span><span class="badge hide" id="badgeReview">0</span></button>
    <button class="tab" data-view="import">📥 <span>Import CSV</span></button>
    <button class="tab" data-view="stats">📈 <span>Statistiques</span></button>
    <button class="tab" data-view="budgets">🎯 <span>Budgets</span></button>
    <button class="tab" data-view="pro">💼 <span>Pro</span></button>
    <button class="tab" data-view="accounts">🏦 <span>Comptes</span></button>
    <button class="tab" data-view="cats">🏷️ <span>Catégories</span></button>
    <button class="tab" data-view="rules">⚙️ <span>Règles</span></button>
    <button class="tab" data-view="settings">🎨 <span>Réglages</span></button>
    <div class="spacer"></div>
    <small class="muted" style="padding:8px 10px">100 % hors-ligne — aucune donnée ne quitte ce navigateur.</small>
  </nav>
  <main id="main"></main>
</div>
<div id="modals"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================================
   BUDGET — application autonome, sans dépendance externe.
   Sommaire :
     §1  Utilitaires        §2  État & persistance    §3  Données par défaut
     §4  Barèmes fiscaux    §5  Moteurs (règles, régularité, virements)
     §6  Graphiques SVG     §7  Sélection & agrégats  §8  Vues
     §9  Import CSV         §10 Exports (JSON/CSV/XLSX)  §11 Fiscal (onglet Pro)
     §12 Chiffrement        §13 Amorçage
   ========================================================================== */

/* ---------------------------------------------------------------- §1 Utils */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = (p = "i") => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = (a, f = x => x) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août",
                "septembre","octobre","novembre","décembre"];
const MONTHS_S = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/** Format monétaire français. `signed` force le + devant les positifs. */
function money(n, signed = false, dec = 2){
  if (n == null || isNaN(n)) return "—";
  const s = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: dec, maximumFractionDigits: dec })
              .format(Math.abs(n));
  const sign = n < -0.004 ? "−" : (signed && n > 0.004 ? "+" : "");
  return sign + s + " €";
}
const pct = (n, dec = 1) => (n == null || !isFinite(n)) ? "—" :
  new Intl.NumberFormat("fr-FR", { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n) + " %";

/** Accepte "1 234,56", "-1,234.56", "(12,00)", "1234.56 EUR", "+3,50". */
function parseAmount(raw){
  if (raw == null) return NaN;
  if (typeof raw === "number") return raw;
  let s = String(raw).trim();
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[^\d.,+-]/g, "");
  const lastC = s.lastIndexOf(","), lastD = s.lastIndexOf(".");
  if (lastC > -1 && lastD > -1){
    // le séparateur décimal est le dernier des deux ; l'autre sépare les milliers
    if (lastC > lastD) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (lastC > -1){
    // une seule virgule : décimale, sauf si elle groupe les milliers (1,234)
    s = (s.length - lastC - 1 === 3 && /^\d{1,3},\d{3}$/.test(s.replace(/[+-]/g, "")))
        ? s.replace(",", "") : s.replace(",", ".");
  }
  const n = parseFloat(s);
  if (isNaN(n)) return NaN;
  return neg ? -Math.abs(n) : n;
}

const DATE_FORMATS = ["auto","DD/MM/YYYY","MM/DD/YYYY","YYYY-MM-DD","DD-MM-YYYY","DD.MM.YYYY","YYYYMMDD","DDMMYYYY"];

/** Renvoie "YYYY-MM-DD" ou null. */
function parseDate(raw, fmt = "auto"){
  if (!raw) return null;
  const s = String(raw).trim();
  const mk = (y, m, d) => {
    y = +y; m = +m; d = +d;
    if (y < 100) y += y < 70 ? 2000 : 1900;
    if (!(m >= 1 && m <= 12) || !(d >= 1 && d <= 31) || !(y >= 1900 && y <= 2200)) return null;
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  };
  const parts = s.match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (fmt === "DD/MM/YYYY" || fmt === "DD-MM-YYYY" || fmt === "DD.MM.YYYY")
    return parts ? mk(parts[3], parts[2], parts[1]) : null;
  if (fmt === "MM/DD/YYYY") return parts ? mk(parts[3], parts[1], parts[2]) : null;
  if (fmt === "YYYY-MM-DD") return parts ? mk(parts[1], parts[2], parts[3]) : null;
  if (fmt === "YYYYMMDD"){ const m = s.match(/(\d{4})(\d{2})(\d{2})/); return m ? mk(m[1],m[2],m[3]) : null; }
  if (fmt === "DDMMYYYY"){ const m = s.match(/(\d{2})(\d{2})(\d{4})/); return m ? mk(m[3],m[2],m[1]) : null; }
  // auto
  if (parts){
    if (parts[1].length === 4) return mk(parts[1], parts[2], parts[3]);
    const a = +parts[1], b = +parts[2];
    if (a > 12 && b <= 12) return mk(parts[3], parts[2], parts[1]);   // jour d'abord, sans ambiguïté
    if (b > 12 && a <= 12) return mk(parts[3], parts[1], parts[2]);   // mois d'abord
    return mk(parts[3], parts[2], parts[1]);                          // ambigu → convention FR
  }
  let m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return mk(m[1], m[2], m[3]);
  m = s.match(/^(\d{2})(\d{2})(\d{4})$/);     if (m) return mk(m[3], m[2], m[1]);
  return null;
}
const fmtDate = iso => { if (!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const fmtDateLong = iso => { if (!iso) return "—"; const [y,m,d] = iso.split("-");
  return `${+d} ${MONTHS[+m-1]} ${y}`; };
const todayISO = () => new Date().toISOString().slice(0, 10);
const ymOf = iso => (iso || "").slice(0, 7);
const yOf  = iso => (iso || "").slice(0, 4);
const dayNum = iso => { const [y,m,d] = iso.split("-").map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const ymLabel = ym => { const [y,m] = ym.split("-"); return `${MONTHS_S[+m-1]} ${y}`; };
function addMonths(ym, n){
  let [y, m] = ym.split("-").map(Number); m += n;
  y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${String(m).padStart(2,"0")}`;
}

/** Normalise un libellé bancaire pour la comparaison et l'apprentissage. */
function normLabel(s){
  return String(s || "").toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\b(CARTE|CB|PAIEMENT|ACHAT|FACTURE|PRLV|PRELEVEMENT|VIR|VIREMENT|SEPA|RETRAIT|DAB)\b/g, " ")
    .replace(/\b\d{2}[\/.]\d{2}([\/.]\d{2,4})?\b/g, " ")   // dates incluses dans le libellé
    .replace(/\b\d{4,}\b/g, " ")                            // numéros de carte / références
    .replace(/[^A-Z0-9 ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}
/** Cœur du libellé : les 3 premiers mots significatifs, base de la reconnaissance. */
function labelKey(s){ return normLabel(s).split(" ").filter(w => w.length > 2).slice(0, 3).join(" "); }

function download(content, name, mime){
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toast(msg, ms = 2600){
  const el = Object.assign(document.createElement("div"), { className: "toast", textContent: msg });
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), ms);
}

const KEY = "budget.v1", KEY_ENC = "budget.v1.enc";
let S = null;              // état applicatif
let CRYPTO_KEY = null;     // clé AES dérivée, si verrouillage actif
const UNDO = [];           // pile d'annulation (instantanés JSON)

function snapshot(label){
  UNDO.push({ label, json: JSON.stringify(S), at: Date.now() });
  if (UNDO.length > 20) UNDO.shift();
}
function undo(){
  const u = UNDO.pop();
  if (!u) return toast("Rien à annuler");
  S = JSON.parse(u.json); save(); render();
  toast("Annulé : " + u.label);
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    S.meta.savedAt = Date.now();
    const json = JSON.stringify(S);
    try {
      if (CRYPTO_KEY){
        localStorage.setItem(KEY_ENC, await encryptJSON(json, CRYPTO_KEY));
        localStorage.removeItem(KEY);
      } else {
        localStorage.setItem(KEY, json);
        localStorage.removeItem(KEY_ENC);
      }
    } catch (e){
      toast("⚠ Sauvegarde impossible : espace de stockage saturé. Exporte une sauvegarde.");
      console.error(e);
    }
  }, 180);
}
/** Instantanés horodatés conservés à part, pour récupérer une bêtise. */
function pushSnapshotHistory(){
  try {
    const hist = JSON.parse(localStorage.getItem("budget.snaps") || "[]");
    hist.push({ at: Date.now(), n: S.transactions.length, json: JSON.stringify(S) });
    while (hist.length > 5) hist.shift();
    localStorage.setItem("budget.snaps", JSON.stringify(hist));
  } catch (e){ /* quota : on abandonne silencieusement, la sauvegarde principale prime */ }
}

/* --- Règles de catégorisation ------------------------------------------- */
function ruleMatches(rule, tx){
  if (!rule.enabled) return false;
  const m = rule.match || {};
  if (m.accountId && m.accountId !== tx.accountId) return false;
  if (m.amountMin != null && m.amountMin !== "" && Math.abs(tx.amount) < +m.amountMin) return false;
  if (m.amountMax != null && m.amountMax !== "" && Math.abs(tx.amount) > +m.amountMax) return false;
  if (m.direction === "in"  && tx.amount <= 0) return false;
  if (m.direction === "out" && tx.amount >= 0) return false;
  if (!m.value) return m.amountMin != null || m.amountMax != null || !!m.accountId;
  const hay = normLabel(tx.label + " " + (tx.rawLabel || ""));
  const needle = normLabel(m.value);
  switch (m.op){
    case "starts":   return hay.startsWith(needle);
    case "equals":   return hay === needle;
    case "regex":    try { return new RegExp(m.value, "i").test(tx.label || ""); } catch { return false; }
    default:         return hay.includes(needle);
  }
}
/** Applique la première règle correspondante. Renvoie true si la transaction change. */
function applyRules(tx, { force = false } = {}){
  if (!force && tx.locked) return false;
  const rules = [...S.rules].sort((a, b) => (a.priority || 0) - (b.priority || 0));
  for (const r of rules){
    if (!ruleMatches(r, tx)) continue;
    let changed = false;
    if (r.set.categoryId && tx.categoryId !== r.set.categoryId){ tx.categoryId = r.set.categoryId; changed = true; }
    if (r.set.type && tx.type !== r.set.type){ tx.type = r.set.type; changed = true; }
    if (r.set.note && !tx.note){ tx.note = r.set.note; changed = true; }
    if (changed || !tx.categoryId){
      tx.autoCategorized = true; tx.confidence = 1; tx.needsReview = false;
      r.hits = (r.hits || 0) + 1;
    }
    return changed;
  }
  return false;
}
function reapplyAllRules(){
  snapshot("réappliquer les règles");
  let n = 0;
  for (const tx of S.transactions) if (!tx.locked && applyRules(tx)) n++;
  save(); render(); toast(`${n} transaction(s) reclassée(s)`);
}

/* --- Moteur de régularité ------------------------------------------------
   Deux transactions sont « régulières » entre elles si : même cœur de libellé,
   montant à ±tol près, et jour du mois à ±dayTol près. Au-delà de `minSeen`
   occurrences, on considère le mouvement comme connu et on ne demande plus rien.
   Sert pour : virements internes, virements à particulier, abonnements.       */
function regularityGroups(txs = S.transactions){
  const cfg = S.settings.regularity;
  const byKey = new Map();
  for (const t of txs){
    const k = labelKey(t.label);
    if (!k) continue;
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(t);
  }
  const groups = [];
  for (const [key, list] of byKey){
    if (list.length < 2) continue;
    const used = new Set();
    for (let i = 0; i < list.length; i++){
      if (used.has(list[i].id)) continue;
      const ref = list[i], cluster = [ref];
      used.add(ref.id);
      for (let j = i + 1; j < list.length; j++){
        const t = list[j];
        if (used.has(t.id)) continue;
        const amtOK = Math.abs(Math.abs(t.amount) - Math.abs(ref.amount))
                      <= Math.abs(ref.amount) * cfg.amountTol + 0.01;
        const dOK = dayGap(ref.date, t.date) <= cfg.dayTol;
        if (amtOK && dOK){ cluster.push(t); used.add(t.id); }
      }
      if (cluster.length >= cfg.minSeen) groups.push({ key, items: cluster });
    }
  }
  return groups;
}
/** Écart, en jours, entre deux dates ramenées au même mois (jour du mois). */
function dayGap(a, b){
  const da = +a.slice(8, 10), db = +b.slice(8, 10);
  const raw = Math.abs(da - db);
  return Math.min(raw, 31 - raw);   // le 1er et le 30 sont voisins d'un mois à l'autre
}
/** La transaction ressemble-t-elle à un mouvement déjà vu et validé ? */
function isKnownRegular(tx){
  const cfg = S.settings.regularity, k = labelKey(tx.label);
  if (!k) return false;
  const peers = S.transactions.filter(t => t.id !== tx.id && labelKey(t.label) === k
    && !t.needsReview
    && Math.abs(Math.abs(t.amount) - Math.abs(tx.amount)) <= Math.abs(tx.amount) * cfg.amountTol + 0.01
    && dayGap(t.date, tx.date) <= cfg.dayTol);
  return peers.length >= cfg.minSeen;
}
/** Un libellé qui ressemble à un virement vers une personne physique. */
function looksLikePersonTransfer(label){
  const n = normLabel(label);
  if (!/\b(VIR|VIREMENT|VERSEMENT|VERS)\b/i.test(String(label))) {
    // le mot-clé a pu être retiré par la normalisation : on retente sur le brut
    if (!/vir|virement|transfer/i.test(String(label))) return false;
  }
  const words = n.split(" ").filter(Boolean);
  // 1 à 3 mots alphabétiques, aucun terme d'entreprise → probablement un particulier
  if (!words.length || words.length > 3) return false;
  if (/\b(SARL|SAS|SA|EURL|SCI|ASSOC|BANQUE|CAISSE|EDF|ENGIE|ORANGE|SFR|FREE|BOUYGUES|IMPOT|URSSAF|TRESOR|LOYER)\b/.test(n))
    return false;
  return words.every(w => /^[A-Z]+$/.test(w));
}
/** Le libellé contient-il un mot-clé associé à l'un de mes comptes ? */
function accountByKeyword(label, exceptId){
  const n = normLabel(label);
  for (const a of S.accounts){
    if (a.id === exceptId) continue;
    for (const kw of (a.keywords || [])){
      if (kw && n.includes(normLabel(kw))) return a;
    }
  }
  return null;
}

/* --- Appariement des virements internes ----------------------------------
   Deux lignes opposées, sur deux comptes suivis différents, de montants
   quasi identiques et à quelques jours d'intervalle : c'est le même mouvement
   vu deux fois. On les lie pour ne pas le compter deux fois.                */
function matchTransfers({ silent = false } = {}){
  const cfg = S.settings.transferMatch;
  const open = S.transactions.filter(t => t.type === "transfer" && !t.transferPeerId);
  let n = 0;
  for (const a of open){
    if (a.transferPeerId) continue;
    const cand = open.find(b =>
      b.id !== a.id && !b.transferPeerId &&
      b.accountId !== a.accountId &&
      Math.sign(b.amount) === -Math.sign(a.amount) &&
      Math.abs(Math.abs(b.amount) - Math.abs(a.amount)) <= Math.abs(a.amount) * cfg.amountTol + 0.01 &&
      Math.abs(dayNum(b.date) - dayNum(a.date)) <= cfg.dayTol);
    if (cand){ a.transferPeerId = cand.id; cand.transferPeerId = a.id; n++; }
  }
  if (!silent) toast(n ? `${n} virement(s) interne(s) apparié(s)` : "Aucun nouveau virement à apparier");
  return n;
}
/** Classement automatique à l'import : type, catégorie, mise en file d'attente. */
function autoClassify(tx){
  const kwAcc = accountByKeyword(tx.label, tx.accountId);
  if (kwAcc){
    tx.type = "transfer";
    tx.counterAccountId = kwAcc.id;
    tx.needsReview = false;
    return tx;
  }
  tx.type = tx.amount >= 0 ? "income" : "expense";
  if (applyRules(tx)) return tx;
  // virement à un particulier : on demande, sauf si le mouvement est déjà connu
  if (S.settings.askOnPersonTransfer && looksLikePersonTransfer(tx.label) && !isKnownRegular(tx)){
    tx.needsReview = true;
    tx.reviewReason = "Virement à un particulier — nature à préciser";
    return tx;
  }
  if (!tx.categoryId){
    tx.needsReview = true;
    tx.reviewReason = "Aucune catégorie reconnue";
  }
  return tx;
}
/** Détecte les dépenses récurrentes (abonnements) à partir du moteur de régularité. */
function detectRecurring(){
  const groups = regularityGroups(S.transactions.filter(t => t.type === "expense"));
  return groups.map(g => {
    const items = [...g.items].sort((a, b) => a.date < b.date ? -1 : 1);
    const avg = sum(items, t => Math.abs(t.amount)) / items.length;
    return { key: g.key, label: items[items.length - 1].label, count: items.length,
             avg, day: +items[items.length - 1].date.slice(8, 10),
             last: items[items.length - 1].date, categoryId: items[items.length - 1].categoryId };
  }).filter(r => r.count >= 3).sort((a, b) => b.avg * b.count - a.avg * a.count);
}

/* ------------------------------------------------------ §6 Graphiques SVG */
const PAL = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c10"];
const paletteColor = i => `var(${PAL[i % PAL.length]})`;

/** Camembert évidé. data = [{label, value, color}] */
function donut(data, { size = 220, thickness = 30, center = "" } = {}){
  const tot = sum(data, d => d.value);
  if (!tot) return `<p class="muted">Aucune donnée sur la période.</p>`;
  const r = size / 2 - 4, ri = r - thickness, cx = size / 2, cy = size / 2;
  let a0 = -Math.PI / 2, paths = "";
  for (const d of data){
    if (!d.value) continue;
    if (d.value / tot > 0.9999){
      // une seule part : un arc de 360° est vide en SVG, on trace un anneau
      paths += `<circle cx="${cx}" cy="${cy}" r="${(r + ri) / 2}" fill="none"
        stroke="${d.color}" stroke-width="${thickness}"><title>${esc(d.label)} : ${money(d.value)} (100 %)</title></circle>`;
      continue;
    }
    const a1 = a0 + (d.value / tot) * Math.PI * 2;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (ang, rad) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
    paths += `<path d="M ${P(a0,r)} A ${r} ${r} 0 ${large} 1 ${P(a1,r)} L ${P(a1,ri)} A ${ri} ${ri} 0 ${large} 0 ${P(a0,ri)} Z"
      fill="${d.color}" stroke="var(--surface)" stroke-width="1"><title>${esc(d.label)} : ${money(d.value)} (${pct(d.value/tot*100)})</title></path>`;
    a0 = a1;
  }
  const mid = center ? `<text x="${cx}" y="${cy-2}" text-anchor="middle" class="val" style="font-size:15px">${esc(center)}</text>
     <text x="${cx}" y="${cy+15}" text-anchor="middle" style="font-size:11px">total</text>` : "";
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;display:block;margin:auto">${paths}${mid}</svg>`;
}
function legend(data){
  const tot = sum(data, d => d.value) || 1;
  return `<div class="legend">` + data.map(d =>
    `<span><i style="background:${d.color}"></i>${esc(d.label)} <span class="muted">${pct(d.value/tot*100,0)}</span></span>`).join("") + `</div>`;
}

/** Barres verticales groupées ou empilées. series = [{name,color,values[]}] */
function barChart(labels, series, { h = 200, stacked = false, fmt = money } = {}){
  if (!labels.length) return `<p class="muted">Aucune donnée.</p>`;
  // peu de barres → on élargit pour que le graphique remplisse sa carte au lieu de flotter
  const W = Math.max(labels.length <= 8 ? 620 : 360,
                     labels.length * (stacked ? 56 : 34 * series.length + 26));
  const padL = 54, padR = 14, padB = 26, padT = 10, ch = h - padB - padT;
  const totals = labels.map((_, i) => stacked ? sum(series, s => Math.abs(s.values[i] || 0))
                                              : Math.max(...series.map(s => Math.abs(s.values[i] || 0))));
  const max = Math.max(1, ...totals);
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = (W - padL - padR) / labels.length;
  let g = "", bars = "";
  for (let v = 0; v <= top + 1e-9; v += step){
    const y = padT + ch - (v / top) * ch;
    g += `<line class="gridline" x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>
          <text x="${padL-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${shortNum(v)}</text>`;
  }
  labels.forEach((lb, i) => {
    const x0 = padL + i * bw;
    if (stacked){
      let acc = 0;
      series.forEach(s => {
        const v = Math.abs(s.values[i] || 0); if (!v) return;
        const hh = (v / top) * ch, y = padT + ch - (acc + v) / top * ch;
        bars += `<rect x="${(x0+bw*0.18).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(0,hh).toFixed(1)}" fill="${s.color}"><title>${esc(lb)} — ${esc(s.name)} : ${fmt(v)}</title></rect>`;
        acc += v;
      });
    } else {
      const n = series.length, w = bw * 0.7 / n;
      series.forEach((s, k) => {
        const v = Math.abs(s.values[i] || 0);
        const hh = (v / top) * ch, y = padT + ch - hh;
        bars += `<rect x="${(x0+bw*0.15+k*w).toFixed(1)}" y="${y.toFixed(1)}" width="${(w*0.86).toFixed(1)}" height="${Math.max(0,hh).toFixed(1)}" fill="${s.color}" rx="2"><title>${esc(lb)} — ${esc(s.name)} : ${fmt(v)}</title></rect>`;
      });
    }
    bars += `<text x="${(x0+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}"
    style="max-width:100%;height:auto;display:block">${g}${bars}</svg></div>`;
}

/** Courbe simple. points = [{x:label, y:number}] */
function lineChart(points, { h = 190, color = "var(--accent)", area = true, fmt = money } = {}){
  if (points.length < 2) return `<p class="muted">Pas assez de points pour tracer une courbe.</p>`;
  const W = Math.max(points.length <= 8 ? 620 : 360, points.length * 48),
        padL = 58, padR = 28, padB = 24, padT = 10;
  const ch = h - padB - padT, cw = W - padL - padR;
  const ys = points.map(p => p.y);
  let lo = Math.min(0, ...ys), hi = Math.max(...ys, 1);
  const step = niceStep(hi - lo || hi), top = Math.ceil(hi / step) * step,
        bot = Math.floor(lo / step) * step, span = (top - bot) || 1;
  const X = i => padL + (points.length === 1 ? cw / 2 : i * cw / (points.length - 1));
  const Y = v => padT + ch - ((v - bot) / span) * ch;
  let g = "";
  for (let v = bot; v <= top + 1e-9; v += step){
    g += `<line class="gridline" x1="${padL}" x2="${W-padR+10}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
          <text x="${padL-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${shortNum(v)}</text>`;
  }
  const d = points.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const ar = area ? `<path d="${d} L${X(points.length-1).toFixed(1)},${Y(Math.max(bot,0)).toFixed(1)} L${X(0).toFixed(1)},${Y(Math.max(bot,0)).toFixed(1)} Z" fill="${color}" opacity=".13"/>` : "";
  const dots = points.map((p, i) =>
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.2" fill="${color}"><title>${esc(p.x)} : ${fmt(p.y)}</title></circle>`).join("");
  const lbl = points.map((p, i) => (points.length > 14 && i % 2) ? "" :
    `<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(p.x)}</text>`).join("");
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}"
    style="max-width:100%;height:auto;display:block">${g}${ar}<path d="${d}" fill="none"
    stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}${lbl}</svg></div>`;
}

/** Barre de proportion horizontale (100 %). */
function stackBar(data, { h = 26 } = {}){
  const tot = sum(data, d => d.value);
  if (!tot) return `<div class="bar"><i style="width:0"></i></div>`;
  let x = 0;
  const segs = data.map(d => {
    const w = d.value / tot * 100, s =
      `<div title="${esc(d.label)} : ${money(d.value)} (${pct(w)})" style="width:${w}%;background:${d.color}"></div>`;
    x += w; return s;
  }).join("");
  return `<div style="display:flex;height:${h}px;border-radius:6px;overflow:hidden;background:var(--surface3)">${segs}</div>`;
}

/** Cascade (waterfall) : du CA au net. rows = [{label, delta, kind}] */
function waterfall(rows, start){
  let acc = start;
  const maxv = Math.max(start, 1);
  let html = `<div class="wf-row"><div class="lbl"><b>Chiffre d'affaires</b></div><div class="amt"><b>${money(start)}</b></div></div>`;
  for (const r of rows){
    if (Math.abs(r.delta) < 0.005 && !r.always) continue;
    acc += r.delta;
    const w = clamp(Math.abs(r.delta) / maxv * 100, 0.5, 100);
    html += `<div class="wf-row"><div class="lbl">
      <span style="flex:1">${esc(r.label)}${r.hint ? ` <span class="muted">— ${esc(r.hint)}</span>` : ""}</span>
      <span style="width:90px;flex:none"><span class="bar" style="display:block"><i style="width:${w}%;background:${r.delta<0?"var(--neg)":"var(--pos)"}"></i></span></span>
      </div><div class="amt ${r.delta<0?"neg":"pos"}">${money(r.delta, true)}</div></div>`;
  }
  html += `<div class="wf-row total"><div class="lbl">Revenu net</div><div class="amt">${money(acc)}</div></div>`;
  return html;
}

/** Carte de chaleur mois × catégories. */
function heatmap(rowLabels, colLabels, matrix){
  const max = Math.max(1, ...matrix.flat());
  let html = `<div class="tablewrap"><table><thead><tr><th class="nosort">Catégorie</th>` +
    colLabels.map(c => `<th class="num nosort">${esc(c)}</th>`).join("") + `<th class="num nosort">Total</th></tr></thead><tbody>`;
  rowLabels.forEach((r, i) => {
    const tot = sum(matrix[i]);
    html += `<tr><td>${esc(r)}</td>` + matrix[i].map(v => {
      const a = v / max;
      return `<td class="num" style="background:color-mix(in srgb,var(--accent) ${(a*72).toFixed(0)}%,transparent)">${v ? money(v, false, 0) : "<span class='muted'>·</span>"}</td>`;
    }).join("") + `<td class="num"><b>${money(tot, false, 0)}</b></td></tr>`;
  });
  return html + `</tbody></table></div>`;
}

function niceStep(range){
  if (!isFinite(range) || range <= 0) return 1;
  const raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
function shortNum(v){
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a % 1e6 ? 1 : 0).replace(".", ",") + "M";
  if (a >= 1000) return (v / 1000).toFixed(a % 1000 && a < 1e4 ? 1 : 0).replace(".", ",") + "k";
  return String(Math.round(v)).replace(".", ",");
}

/* --------------------------------------------- §7 Sélection et agrégats */
/** Comptes retenus pour les totaux (null = tous). */
function selectedAccountIds(){
  const sel = S.settings.selectedAccounts;
  const all = activeAccounts().map(a => a.id);
  if (!sel || !sel.length) return all;
  return all.filter(id => sel.includes(id));
}
/** Transactions de la période et des comptes sélectionnés. */
function periodTx(opts = {}){
  const p = opts.period || S.settings.period;
  const ids = new Set(opts.allAccounts ? S.accounts.map(a => a.id) : selectedAccountIds());
  return S.transactions.filter(t => {
    if (!ids.has(t.accountId)) return false;
    if (p.mode === "month") return ymOf(t.date) === p.ym;
    if (p.mode === "year")  return yOf(t.date) === String(p.year);
    if (p.mode === "range") return (!p.from || t.date >= p.from) && (!p.to || t.date <= p.to);
    return true;                                   // mode "all"
  });
}
function periodLabel(p = S.settings.period){
  if (p.mode === "month"){ const [y, m] = p.ym.split("-"); return `${MONTHS[+m-1]} ${y}`; }
  if (p.mode === "year")  return `année ${p.year}`;
  if (p.mode === "range") return `${p.from ? fmtDate(p.from) : "début"} → ${p.to ? fmtDate(p.to) : "aujourd'hui"}`;
  return "tout l'historique";
}
/* Les deux jambes d'un virement interne sont comptées, ou aucune : c'est ce qui
   garde le résultat juste. Si les deux comptes sont dans le périmètre, elles
   s'annulent (un mouvement interne n'appauvrit personne) ; si un seul l'est, la
   sortie compte pour ce qu'elle est — de l'argent qui quitte le périmètre suivi. */
const transferCounts = t => t.type !== "transfer" || S.settings.countTransfers;

/** Bilan d'une liste de transactions. */
function totals(txs){
  let income = 0, expense = 0, transferIn = 0, transferOut = 0;
  for (const t of txs){
    if (t.type === "transfer"){
      if (t.amount >= 0) transferIn += t.amount; else transferOut += -t.amount;
      if (!transferCounts(t)) continue;
    }
    if (t.amount >= 0) income += t.amount;
    else expense += -t.amount;
  }
  const net = income - expense;
  return { income, expense, net, transferIn, transferOut,
           savingRate: income ? net / income * 100 : 0 };
}
/** Dépenses par catégorie, triées. */
function byCategory(txs, kind = "expense"){
  const m = new Map();
  for (const t of txs){
    if (kind === "expense" && !(t.amount < 0 && t.type !== "transfer")) continue;
    if (kind === "income"  && !(t.amount > 0 && t.type !== "transfer")) continue;
    const id = t.categoryId || "__none";
    m.set(id, (m.get(id) || 0) + Math.abs(t.amount));
  }
  return [...m].map(([id, value]) => ({
    id, value, label: id === "__none" ? "Non catégorisé" : catPath(id),
    color: id === "__none" ? "var(--c10)" : catColor(id),
  })).sort((a, b) => b.value - a.value);
}
/** Répartition fixe/variable et essentiel/loisir/épargne. */
function byAxis(txs, axis){
  const m = new Map();
  for (const t of txs){
    if (!(t.amount < 0 && t.type !== "transfer")) continue;
    const c = catById(t.categoryId);
    const k = c ? c[axis] : "__none";
    m.set(k, (m.get(k) || 0) + Math.abs(t.amount));
  }
  const LB = { fixe:["Fixe","var(--c1)"], variable:["Variable","var(--c3)"],
               essentiel:["Essentiel","var(--c1)"], loisir:["Loisir","var(--c4)"],
               epargne:["Épargne","var(--c2)"], __none:["Non classé","var(--c10)"] };
  return [...m].map(([k, value]) => ({ key:k, value, label:(LB[k]||[k])[0], color:(LB[k]||["", "var(--c10)"])[1] }))
               .sort((a, b) => b.value - a.value);
}
/** Solde d'un compte à une date donnée (ou aujourd'hui). */
function accountBalance(id, upTo){
  const a = accById(id); if (!a) return 0;
  return (a.initialBalance || 0) + sum(S.transactions.filter(t =>
    t.accountId === id && (!upTo || t.date <= upTo)), t => t.amount);
}
/** Série mensuelle des soldes cumulés des comptes sélectionnés. */
function balanceSeries(months){
  const ids = selectedAccountIds();
  const base = sum(ids, id => accById(id)?.initialBalance || 0);
  return months.map(ym => {
    const end = lastDayOf(ym);
    const v = base + sum(S.transactions.filter(t => ids.includes(t.accountId) && t.date <= end), t => t.amount);
    return { x: ymLabel(ym), y: round2(v) };
  });
}
function lastDayOf(ym){
  const [y, m] = ym.split("-").map(Number);
  return `${ym}-${String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2,"0")}`;
}
/** Les N derniers mois présents dans les données (ou autour de la période). */
function recentMonths(n = 12){
  const set = new Set(S.transactions.map(t => ymOf(t.date)).filter(Boolean));
  const p = S.settings.period;
  if (p.mode === "month") set.add(p.ym);
  if (!set.size) set.add(todayISO().slice(0, 7));
  return [...set].sort().slice(-n);
}
/** Reste à dépenser / dépassement, à partir des budgets par catégorie. */
function budgetStatus(txs){
  const spent = new Map();
  for (const t of txs){
    if (!(t.amount < 0 && t.type !== "transfer")) continue;
    spent.set(t.categoryId, (spent.get(t.categoryId) || 0) + Math.abs(t.amount));
  }
  const rows = Object.entries(S.budgets)
    .filter(([id, amt]) => amt > 0 && catById(id))
    .map(([id, amt]) => {
      const used = spent.get(id) || 0;
      return { id, name: catPath(id), color: catColor(id), budget: +amt, used,
               left: +amt - used, over: Math.max(0, used - +amt) };
    }).sort((a, b) => b.used / b.budget - a.used / a.budget);
  const budget = sum(rows, r => r.budget), used = sum(rows, r => r.used);
  return { rows, budget, used, left: Math.max(0, budget - used), over: Math.max(0, used - budget) };
}

let VIEW = "dash";

function go(v){ VIEW = v; render(); location.hash = v; }

function applyTheme(){
  const t = S.theme, r = document.documentElement;
  r.dataset.dark = t.dark ? "1" : "0";

  const st = r.style;

                  rounded:"'Nunito','Segoe UI Variable',system-ui,sans-serif" };

/* --- Modale générique ---------------------------------------------------- */
function modal({ title, body, footer = "", wide = false, onOpen }){
  const host = $("#modals");
  host.innerHTML = `<div class="modal"><div class="box${wide ? " wide" : ""}">
      <div class="head"><h3>${esc(title)}</h3><button class="ghost" data-close>✕</button></div>
      <div class="body">${body}</div>
      ${footer ? `<div class="foot">${footer}</div>` : ""}
    </div></div>`;
  const box = $(".modal", host);
  box.addEventListener("mousedown", e => { if (e.target === box) closeModal(); });
  wire(host);
  onOpen && onOpen(host);
  const first = $("input,select,textarea", host); first && first.focus();
  return host;
}
function closeModal(){ $("#modals").innerHTML = ""; }

/* --- Câblage déclaratif : data-act="nom:arg" ----------------------------- */
const ACTIONS = {};
function wire(root){
  $$("[data-act]", root).forEach(el => {
    if (el.__wired) return; el.__wired = true;
    const [name, ...rest] = el.dataset.act.split(":");
    const arg = rest.join(":");
    const ev = el.dataset.on || (el.matches("input,select,textarea") ? "change" : "click");
    el.addEventListener(ev, e => {
      const fn = ACTIONS[name];
      if (!fn) return console.warn("action inconnue", name);
      fn(arg, el, e);
    });
  });
  $$("[data-close]", root).forEach(el => el.addEventListener("click", closeModal));
}

        <select data-act="setYear">${years.map(y => `<option ${y===String(p.year)?"selected":""}>${y}</option>`).join("")}</select></label>` : ""}

function dashBlock(id, txs, T){
  switch (id){
    case "kpi": {
      const bs = budgetStatus(txs);
      const pctIn = T.income + T.expense ? T.income / (T.income + T.expense) * 100 : 0;
      return `<div class="grid3">
        <div class="stat"><div class="k">Revenus</div><div class="v pos">${money(T.income)}</div>
          <div class="s">${pct(pctIn)} des flux</div></div>
        <div class="stat"><div class="k">Dépenses</div><div class="v neg">${money(T.expense)}</div>
          <div class="s">${pct(T.income ? T.expense / T.income * 100 : 0)} des revenus</div></div>
        <div class="stat"><div class="k">Résultat</div><div class="v ${T.net>=0?"pos":"neg"}">${money(T.net, true)}</div>
          <div class="s">taux d'épargne ${pct(T.savingRate)}</div></div>
        <div class="stat"><div class="k">${bs.over > 0 ? "Trop dépensé" : "Reste à dépenser"}</div>
          <div class="v ${bs.over>0?"neg":"pos"}">${money(bs.over > 0 ? bs.over : bs.left)}</div>
          <div class="s">${bs.budget ? `sur ${money(bs.budget)} budgétés` : `<a href="#budgets" data-act="goto:budgets">définir des budgets</a>`}</div></div>
      </div>`;
    }
    case "split": {
      const data = [{ label:"Revenus", value:T.income, color:"var(--pos)" },
                    { label:"Dépenses", value:T.expense, color:"var(--neg)" }];
      return donut(data, { center: money(T.net, true, 0) }) + legend(data) +
        (T.transferIn || T.transferOut ? `<p class="muted" style="margin:8px 0 0;font-size:.88em">
          Virements internes sur la période : ${money(T.transferOut)} sortis, ${money(T.transferIn)} entrés —
          ${S.settings.countTransfers
            ? "comptés dans les revenus et les dépenses ; entre deux comptes suivis ils s'annulent et ne changent pas le résultat"
            : "exclus des revenus comme des dépenses"}.</p>` : "");
    }
    case "cats": {
      const d = byCategory(txs).slice(0, 9);
      return donut(d, { center: money(sum(d, x => x.value), false, 0) }) + legend(d);
    }
    case "months": {
      const ms = recentMonths(12);
      const inc = ms.map(m => totals(S.transactions.filter(t => ymOf(t.date) === m && selectedAccountIds().includes(t.accountId))).income);
      const exp = ms.map(m => totals(S.transactions.filter(t => ymOf(t.date) === m && selectedAccountIds().includes(t.accountId))).expense);
      return barChart(ms.map(ymLabel), [
        { name:"Revenus", color:"var(--pos)", values:inc },
        { name:"Dépenses", color:"var(--neg)", values:exp }], { h:210 });
    }
    case "nature": {
      const fx = byAxis(txs, "fixity"), nt = byAxis(txs, "nature");
      return `<h4>Fixe / variable</h4>${stackBar(fx)}${legend(fx)}
              <div class="sep"></div><h4>Essentiel / loisir / épargne</h4>${stackBar(nt)}${legend(nt)}`;
    }
    case "balance": {
      const pts = balanceSeries(recentMonths(12));
      return lineChart(pts, { h:200 }) + `<p class="muted" style="margin:6px 0 0;font-size:.88em">
        Solde cumulé des comptes sélectionnés, soldes initiaux inclus.</p>`;
    }
    case "budgets": {
      const bs = budgetStatus(txs);
      if (!bs.rows.length) return `<p class="muted">Aucun budget défini. <a href="#budgets" data-act="goto:budgets">En créer</a>.</p>`;
      return bs.rows.slice(0, 7).map(r => {
        const p = clamp(r.used / r.budget * 100, 0, 100);
        return `<div style="margin-bottom:9px"><div class="row tight" style="justify-content:space-between;margin-bottom:3px">
            <span class="chip"><i class="sw" style="background:${r.color}"></i>${esc(r.name)}</span>
            <span class="${r.over?"neg":"muted"}" style="font-variant-numeric:tabular-nums">${money(r.used,false,0)} / ${money(r.budget,false,0)}</span></div>
          <div class="bar"><i style="width:${p}%;background:${r.over?"var(--neg)":p>85?"var(--warn)":"var(--pos)"}"></i></div></div>`;
      }).join("");
    }
    case "recent": {
      const rec = [...txs].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 9);
      if (!rec.length) return `<p class="muted">Aucune transaction sur la période.</p>`;
      return `<div class="tablewrap"><table><tbody>${rec.map(t => `<tr>
          <td style="white-space:nowrap">${fmtDate(t.date)}</td>
          <td>${esc(t.label)}</td>
          <td>${t.categoryId ? `<span class="chip"><i class="sw" style="background:${catColor(t.categoryId)}"></i>${esc(catName(t.categoryId))}</span>` : `<span class="muted">—</span>`}</td>
          <td class="num ${t.amount<0?"neg":"pos"}">${money(t.amount, true)}</td>
          <td><button class="ghost sm" data-act="editTx:${t.id}">✎</button></td></tr>`).join("")}</tbody></table></div>`;
    }
    case "review": {
      const n = S.transactions.filter(t => t.needsReview).length;
      if (!n) return `<p class="muted">Rien à valider. Tout est classé. 👌</p>`;
      return `<p style="margin:0 0 10px"><b>${n}</b> transaction(s) attendent une précision de ta part.</p>
        <button class="primary" data-act="goto:review">Traiter maintenant</button>`;
    }
    case "pro": {
      if (!S.pro) return `<p class="muted">Aucun profil professionnel. <a href="#pro" data-act="goto:pro">Configurer l'onglet Pro</a>.</p>`;
      const res = solveForNet(S.pro);
      if (!res.ok) return `<p class="muted">${esc(res.message)}</p>`;
      const realised = sum(S.transactions.filter(t => yOf(t.date) === String(S.pro.year) && t.proRevenue), t => t.amount);
      return `<div class="grid3">
        <div class="stat"><div class="k">CA annuel nécessaire</div><div class="v">${money(res.ca)}</div>
          <div class="s">pour ${money(S.pro.target.net)} net ${S.pro.target.basis === "apresImpot" ? "après impôt" : "avant impôt"}</div></div>
        <div class="stat"><div class="k">Par mois travaillé</div><div class="v">${money(res.ca / (S.pro.target.monthsWorked || 12))}</div>
          <div class="s">${S.pro.target.monthsWorked || 12} mois</div></div>
        <div class="stat"><div class="k">TJM nécessaire</div>
          <div class="v">${S.pro.target.billableDays ? money(res.ca / S.pro.target.billableDays) : "—"}</div>
          <div class="s">${S.pro.target.billableDays || 0} jours facturables</div></div>
        <div class="stat"><div class="k">CA déjà réalisé</div><div class="v">${money(realised)}</div>
          <div class="s">${pct(res.ca ? realised / res.ca * 100 : 0)} de l'objectif</div></div>
      </div>`;
    }
  }
  return "";
}

/* Déplacement des blocs par glisser-déposer */
let dragBlk = null;
function initDashDnD(){
  const dash = $("#dash"); if (!dash) return;
  $$(".blk", dash).forEach(el => {
    const grip = $(".grip", el);
    grip && grip.addEventListener("dragstart", e => {
      dragBlk = el.dataset.blk; el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragBlk);
    });
    grip && grip.addEventListener("dragend", () => {
      dragBlk = null; $$(".blk").forEach(b => b.classList.remove("dragging", "over"));
    });
    el.addEventListener("dragover", e => {
      if (!dragBlk || el.dataset.blk === dragBlk) return;
      e.preventDefault(); el.classList.add("over");
    });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", e => {
      e.preventDefault(); el.classList.remove("over");
      if (!dragBlk) return;
      const L = S.layout.blocks;
      const from = L.findIndex(b => b.id === dragBlk), to = L.findIndex(b => b.id === el.dataset.blk);
      if (from < 0 || to < 0) return;
      L.splice(to, 0, L.splice(from, 1)[0]);
      save(); render();
    });
  });
}
ACTIONS.blkHide = id => { S.layout.blocks.find(b => b.id === id).visible = false; save(); render(); };
ACTIONS.blkShow = id => { S.layout.blocks.find(b => b.id === id).visible = true; save(); render(); };
ACTIONS.blkSpan = id => {
  const b = S.layout.blocks.find(x => x.id === id);
  const order = [3, 4, 6, 8, 12];
  b.span = order[(order.indexOf(b.span) + 1) % order.length];
  save(); render();
};
ACTIONS.blkReset = () => { S.layout.blocks = DEFAULT_BLOCKS.map(b => ({ ...b })); save(); render(); };
ACTIONS.goto = v => go(v);
ACTIONS.print = () => window.print();

let SORT = { key:"date", dir:-1 };
const TX_COLS = {
  date:{ label:"Date", get:t => fmtDate(t.date), sort:t => t.date },
  account:{ label:"Compte", get:t => esc(accById(t.accountId)?.name || "—"), sort:t => accById(t.accountId)?.name || "" },
  label:{ label:"Libellé", get:t => esc(t.label) + (t.autoCategorized ? ` <span class="muted" title="Classée automatiquement">⚡</span>` : ""), sort:t => t.label },
  category:{ label:"Catégorie", sort:t => catPath(t.categoryId),
    get:t => t.categoryId ? `<span class="chip"><i class="sw" style="background:${catColor(t.categoryId)}"></i>${esc(catPath(t.categoryId))}</span>`
                          : `<span class="muted">—</span>` },
  type:{ label:"Type", sort:t => t.type,
    get:t => `<span class="pill ${t.type==="income"?"rev":t.type==="expense"?"dep":"vir"}">${
      t.type==="income"?"revenu":t.type==="expense"?"dépense":"virement"}</span>` },
  amount:{ label:"Montant", cls:"num", sort:t => t.amount,
    get:t => `<span class="${t.amount<0?"neg":"pos"}">${money(t.amount, true)}</span>` },
  note:{ label:"Note", get:t => esc(t.note || ""), sort:t => t.note || "" },
  tags:{ label:"Tags", get:t => (t.tags||[]).map(x => `<span class="chip">${esc(x)}</span>`).join(" "), sort:t => (t.tags||[]).join(",") },
  balance:{ label:"Solde", cls:"num", sort:t => t.date, get:t => money(accountBalance(t.accountId, t.date)) },
};
function filteredTx(){
  const q = normLabel(FILTER.q);
  let list = periodTx().filter(t => {
    if (FILTER.acc && t.accountId !== FILTER.acc) return false;
    if (FILTER.cat && t.categoryId !== FILTER.cat) return false;
    if (FILTER.type && t.type !== FILTER.type) return false;
    if (FILTER.uncat && t.categoryId) return false;
    if (FILTER.tag && !(t.tags || []).includes(FILTER.tag)) return false;
    if (FILTER.min !== "" && Math.abs(t.amount) < +FILTER.min) return false;
    if (FILTER.max !== "" && Math.abs(t.amount) > +FILTER.max) return false;
    if (q && !normLabel(t.label + " " + (t.note || "")).includes(q)) return false;
    return true;
  });
  const s = TX_COLS[SORT.key]?.sort || (t => t.date);
  list.sort((a, b) => { const x = s(a), y = s(b); return (x < y ? -1 : x > y ? 1 : 0) * SORT.dir; });
  return list;
}

        <label class="inline" style="margin-top:14px"><input type="checkbox" ${FILTER.uncat?"checked":""} data-act="filt:uncat"> non catégorisées</label>

      <label class="f"><span>Type</span><select id="f-type">
        <option value="expense" ${t.type==="expense"?"selected":""}>Dépense</option>

        <option value="transfer"${t.type==="transfer"?"selected":""}>Virement interne</option></select></label>
      <label class="f"><span>Montant (€)</span><input type="number" step="0.01" id="f-amount"
        value="${t.amount != null ? Math.abs(t.amount) : ""}" placeholder="0,00"></label>
    </div>
    <div id="f-catwrap"><label class="f"><span>Catégorie</span><select id="f-cat">
      <option value="">— non catégorisé —</option>${catOpts()}</select></label></div>
    <div id="f-transferwrap" class="${t.type==="transfer"?"":"hide"}">
      <label class="f"><span>Compte de contrepartie (facultatif)</span><select id="f-counter">
        <option value="">— non précisé —</option>${accs.filter(a => a.id !== t.accountId).map(a =>
          `<option value="${a.id}" ${t.counterAccountId===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
      <p class="muted" style="margin:6px 0 0;font-size:.88em">Un virement interne n'est compté dans le résultat que si l'option est activée dans le sélecteur de période.</p>
    </div>
    <label class="f"><span>Note</span><textarea id="f-note" rows="2" placeholder="Contexte, justificatif, personne concernée…">${esc(t.note || "")}</textarea></label>
    <label class="f"><span>Tags (séparés par des virgules)</span><input id="f-tags" value="${esc((t.tags||[]).join(", "))}"></label>
    <label class="inline"><input type="checkbox" id="f-pro" ${t.proRevenue?"checked":""}> Recette ou charge professionnelle (onglet Pro)</label>`;
}
function readTxForm(t){
  const type = $("#f-type").value;
  const amt = Math.abs(parseAmount($("#f-amount").value) || 0);
  t.date = $("#f-date").value || todayISO();
  t.accountId = $("#f-acc").value;
  t.label = $("#f-label").value.trim() || "(sans libellé)";
  t.type = type;
  t.amount = type === "income" ? amt : (type === "expense" ? -amt : (t.amount < 0 ? -amt : amt));
  t.categoryId = $("#f-cat") ? $("#f-cat").value : t.categoryId;
  t.counterAccountId = $("#f-counter") ? $("#f-counter").value : "";
  t.note = $("#f-note").value.trim();
  t.tags = $("#f-tags").value.split(",").map(s => s.trim()).filter(Boolean);
  t.proRevenue = $("#f-pro").checked;
  t.needsReview = false;
  t.locked = true;                       // saisie manuelle : les règles ne l'écrasent plus
  return t;
}
ACTIONS.newTx = () => {
  if (!S.accounts.length) return needAccount();
  const t = { id: uid("t"), date: todayISO(), accountId: activeAccounts()[0]?.id, type: "expense", amount: null };
  modal({ title:"Nouvelle transaction", body: txForm(t),
    footer:`<button data-close>Annuler</button><button class="primary" data-act="saveNewTx">Enregistrer</button>`,
    onOpen: hookTypeSwitch });
};
ACTIONS.saveNewTx = () => {
  const t = readTxForm({ id: uid("t") });
  if (!t.amount) return toast("Indique un montant");
  snapshot("nouvelle transaction");
  S.transactions.push(t);
  if (t.type === "transfer") matchTransfers({ silent:true });
  save(); closeModal(); render(); toast("Transaction ajoutée");
};
ACTIONS.editTx = id => {
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  const peer = t.transferPeerId && S.transactions.find(x => x.id === t.transferPeerId);
  modal({ title:"Modifier la transaction", body: txForm(t) +
      (peer ? `<div class="note info">Appariée avec « ${esc(peer.label)} » du ${fmtDate(peer.date)}
        sur ${esc(accById(peer.accountId)?.name || "?")}. <a href="#" data-act="unpair:${t.id}">Défaire l'appariement</a></div>` : "") +
      (t.importBatchId ? `<p class="muted" style="margin:0;font-size:.85em">Issue de l'import du
        ${fmtDateLong((S.importBatches.find(b => b.id === t.importBatchId)?.at || "").slice(0,10))}.</p>` : ""),
    footer:`<button class="danger" data-act="delTx:${t.id}">Supprimer</button><div class="grow"></div>
            <button data-close>Annuler</button><button class="primary" data-act="saveEditTx:${t.id}">Enregistrer</button>`,
    onOpen: hookTypeSwitch });
};
ACTIONS.saveEditTx = id => {
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  const before = t.categoryId, label = t.label;
  snapshot("modification de transaction");
  readTxForm(t);
  save(); closeModal(); render();
  if (t.categoryId && t.categoryId !== before) proposeRule(label || t.label, t.categoryId);
};
ACTIONS.delTx = id => {
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  if (!confirm(`Supprimer « ${t.label} » du ${fmtDate(t.date)} ?`)) return;
  snapshot("suppression de transaction");
  if (t.transferPeerId){ const p = S.transactions.find(x => x.id === t.transferPeerId); if (p) p.transferPeerId = null; }
  S.transactions = S.transactions.filter(x => x.id !== id);
  save(); closeModal(); render(); toast("Supprimée — Ctrl+Z pour annuler");
};
ACTIONS.unpair = id => {
  const t = S.transactions.find(x => x.id === id);
  const p = S.transactions.find(x => x.id === t.transferPeerId);
  if (p) p.transferPeerId = null;
  t.transferPeerId = null; save(); closeModal(); render();
};
function hookTypeSwitch(root){
  const sel = $("#f-type", root); if (!sel) return;
  const upd = () => {
    $("#f-transferwrap", root).classList.toggle("hide", sel.value !== "transfer");
    $("#f-catwrap", root).classList.toggle("hide", sel.value === "transfer");
  };
  sel.addEventListener("change", upd); upd();
}
function needAccount(){
  modal({ title:"Créer d'abord un compte",
    body:`<p>Chaque transaction appartient à un compte. Crée ton premier compte (compte courant, livret, espèces…).</p>`,
    footer:`<button data-close>Plus tard</button><button class="primary" data-act="goAccounts">Créer un compte</button>` });
}
ACTIONS.goAccounts = () => { closeModal(); go("accounts"); };

/* --- Apprentissage : proposer une règle après une recatégorisation -------- */
function proposeRule(label, categoryId){
  const key = labelKey(label);
  if (!key) return;
  if (S.rules.some(r => normLabel(r.match.value || "") === key)) return;
  const similar = S.transactions.filter(t => labelKey(t.label) === key && t.categoryId !== categoryId).length;
  modal({ title:"Créer une règle ?",
    body:`<p>Tu viens de classer <b>${esc(label)}</b> en <span class="chip"><i class="sw" style="background:${catColor(categoryId)}"></i>${esc(catPath(categoryId))}</span>.</p>
      <p>Veux-tu classer automatiquement, à l'avenir, toute transaction dont le libellé contient
      <b>« ${esc(key)} »</b> dans cette catégorie ?</p>
      ${similar ? `<div class="note">${similar} transaction(s) déjà enregistrée(s) correspondent. Elles seront reclassées si tu appliques la règle à l'historique.</div>` : ""}
      <label class="inline"><input type="checkbox" id="r-past" ${similar?"checked":""}> Appliquer aussi à l'historique</label>`,
    footer:`<button data-close>Non, juste cette fois</button>
            <button class="primary" data-act="createLearnedRule:${categoryId}|${encodeURIComponent(key)}">Créer la règle</button>` });
}
ACTIONS.createLearnedRule = arg => {
  const [categoryId, keyEnc] = arg.split("|");
  const key = decodeURIComponent(keyEnc), past = $("#r-past")?.checked;
  snapshot("création de règle");
  S.rules.push({ id: uid("r"), priority: S.rules.length + 1, enabled: true, hits: 0,
                 match: { field:"label", op:"contains", value:key }, set: { categoryId } });
  if (past) for (const t of S.transactions) if (!t.locked) applyRules(t);
  save(); closeModal(); render(); toast("Règle créée");
};

/* --- Vue : à valider ----------------------------------------------------- */
VIEWS.review = () => {
  const list = S.transactions.filter(t => t.needsReview)
    .sort((a, b) => a.date < b.date ? 1 : -1);
  if (!list.length) return `<h1>À valider</h1>
    <div class="card"><p class="muted" style="margin:0">Rien en attente : toutes les transactions sont classées.</p></div>
    <p class="muted">Y arrivent automatiquement les virements vers des particuliers non reconnus et les lignes qu'aucune règle ne sait classer.</p>`;
  const cats = S.categories.filter(c => !c.archived);
  return `<div class="row"><h1 style="margin:0">À valider <span class="muted" style="font-weight:400">— ${list.length}</span></h1>
      <div class="grow"></div><button data-act="reviewAllOther">Tout classer en « Autre »</button></div>
    <p class="muted">Choisis une catégorie : la ligne sort de la file. Une règle te sera proposée pour automatiser la suite.</p>
    <div class="stack">${list.slice(0, 60).map(t => `
      <div class="card"><div class="row">
        <div class="grow" style="min-width:220px">
          <div style="font-weight:600">${esc(t.label)}</div>
          <div class="muted" style="font-size:.9em">${fmtDate(t.date)} · ${esc(accById(t.accountId)?.name||"—")}
            · <span class="${t.amount<0?"neg":"pos"}">${money(t.amount, true)}</span></div>
          ${t.reviewReason ? `<div class="pill warn" style="margin-top:5px">${esc(t.reviewReason)}</div>` : ""}
        </div>
        <label class="f" style="max-width:230px"><span>Classer en</span>
          <select data-act="reviewCat:${t.id}"><option value="">— choisir —</option>
            ${cats.map(c => `<option value="${c.id}">${esc(catPath(c.id))}</option>`).join("")}</select></label>
        <div class="stack" style="gap:5px">
          <button class="sm" data-act="reviewTransfer:${t.id}">C'est un virement interne</button>
          <button class="sm ghost" data-act="editTx:${t.id}">Ouvrir en détail</button>
          <button class="sm ghost" data-act="reviewSkip:${t.id}">Laisser sans catégorie</button>
        </div></div></div>`).join("")}</div>
    ${list.length > 60 ? `<p class="muted">… et ${list.length - 60} autre(s). Traite celles-ci d'abord.</p>` : ""}`;
};
ACTIONS.reviewCat = (id, el) => {
  const t = S.transactions.find(x => x.id === id); if (!t || !el.value) return;
  snapshot("validation");
  t.categoryId = el.value; t.needsReview = false; t.reviewReason = "";
  save(); render(); proposeRule(t.label, t.categoryId);
};
ACTIONS.reviewTransfer = id => {
  const t = S.transactions.find(x => x.id === id); if (!t) return;
  snapshot("validation");
  t.type = "transfer"; t.needsReview = false; t.reviewReason = ""; t.categoryId = "";
  matchTransfers({ silent:true }); save(); render();
};
ACTIONS.reviewSkip = id => {
  const t = S.transactions.find(x => x.id === id);
  t.needsReview = false; t.reviewReason = ""; save(); render();
};
ACTIONS.reviewAllOther = () => {
  const other = S.categories.find(c => c.name === "Autre" && c.kind === "expense");
  if (!other) return toast("Crée une catégorie « Autre »");
  if (!confirm("Classer toutes les lignes en attente dans « Autre » ?")) return;
  snapshot("validation en masse");
  for (const t of S.transactions) if (t.needsReview){
    if (t.amount < 0) t.categoryId = other.id;
    t.needsReview = false; t.reviewReason = "";
  }
  save(); render();
};
ACTIONS.bulkCat = () => {
  const list = filteredTx();
  modal({ title:`Classer ${list.length} transaction(s)`,
    body:`<p class="muted" style="margin:0">Toutes les lignes actuellement affichées recevront cette catégorie.</p>
      <label class="f"><span>Catégorie</span><select id="bulk-cat">${S.categories.filter(c=>!c.archived)
        .map(c => `<option value="${c.id}">${esc(catPath(c.id))}</option>`).join("")}</select></label>`,
    footer:`<button data-close>Annuler</button><button class="primary" data-act="bulkCatGo">Appliquer</button>` });
};
ACTIONS.bulkCatGo = () => {
  const id = $("#bulk-cat").value, ids = new Set(filteredTx().map(t => t.id));
  snapshot("classement en masse");
  for (const t of S.transactions) if (ids.has(t.id)){ t.categoryId = id; t.needsReview = false; t.locked = true; }
  save(); closeModal(); render(); toast("Classement appliqué");
};

/* --- Vue : comptes ------------------------------------------------------- */

    return `<tr ${a.archived?'style="opacity:.55"':""}>

ACTIONS.newAcc = () => modal({ title:"Nouveau compte", body: accForm({}),

ACTIONS.editAcc = id => modal({ title:"Modifier le compte", body: accForm(accById(id)),

ACTIONS.saveAcc = id => {
  const name = $("#a-name").value.trim();
  if (!name) return toast("Donne un nom au compte");
  snapshot("compte");
  const data = { name, type: $("#a-type").value, initialBalance: parseAmount($("#a-init").value) || 0,

  else { S.accounts.push({ id: uid("a"), archived: false, ...data }); }

};
ACTIONS.archiveAcc = id => { const a = accById(id); a.archived = !a.archived; save(); render(); };
ACTIONS.delAcc = id => {
  const n = S.transactions.filter(t => t.accountId === id).length;
  if (n && !confirm(`Ce compte porte ${n} transaction(s), qui seront supprimées aussi. Continuer ?`)) return;

  S.accounts = S.accounts.filter(a => a.id !== id);

};
ACTIONS.setMatchAmt = (_, el) => { S.settings.transferMatch.amountTol = (+el.value || 0) / 100; save(); };
ACTIONS.setMatchDay = (_, el) => { S.settings.transferMatch.dayTol = +el.value || 0; save(); };
ACTIONS.runMatch = () => { snapshot("appariement"); matchTransfers(); save(); render(); };

/* --- Vue : catégories ---------------------------------------------------- */
VIEWS.cats = () => {
  const draw = kind => {
    const roots = S.categories.filter(c => c.kind === kind && !c.parentId);
    return roots.map(c => {
      const kids = S.categories.filter(k => k.parentId === c.id);
      return catRow(c) + kids.map(k => catRow(k, true)).join("");
    }).join("") || `<tr><td colspan="6" class="muted" style="padding:18px;text-align:center">Aucune catégorie.</td></tr>`;
  };
  return `<div class="row"><h1 style="margin:0">Catégories</h1><div class="grow"></div>
      <button class="primary" data-act="newCat:expense">+ Catégorie de dépense</button>
      <button data-act="newCat:income">+ Catégorie de revenu</button></div>
    <p class="muted">Chaque catégorie de dépense porte deux axes supplémentaires : <b>fixe / variable</b>
      et <b>essentiel / loisir / épargne</b>. Ils alimentent les pourcentages des statistiques.</p>
    <h3 style="margin-top:14px">Dépenses</h3>
    <div class="card tablewrap" style="padding:0"><table><thead><tr>
      <th class="nosort">Catégorie</th><th class="nosort">Fixité</th><th class="nosort">Nature</th>
      <th class="num nosort">Budget / mois</th><th class="num nosort">Lignes</th><th class="nosort"></th>
    </tr></thead><tbody>${draw("expense")}</tbody></table></div>
    <h3 style="margin-top:18px">Revenus</h3>
    <div class="card tablewrap" style="padding:0"><table><thead><tr>
      <th class="nosort">Catégorie</th><th class="nosort"></th><th class="nosort"></th>
      <th class="nosort"></th><th class="num nosort">Lignes</th><th class="nosort"></th>
    </tr></thead><tbody>${draw("income")}</tbody></table></div>`;
};
function catRow(c, child = false){
  const n = S.transactions.filter(t => t.categoryId === c.id).length;
  const FX = { fixe:"Fixe", variable:"Variable" };
  const NT = { essentiel:"Essentiel", loisir:"Loisir", epargne:"Épargne" };
  return `<tr ${c.archived?'style="opacity:.5"':""}>
    <td>${child ? '<span class="muted">↳ </span>' : ""}<span class="chip">
      <i class="sw" style="background:${catColor(c.id)}"></i>${esc(c.name)}</span>
      ${c.pro?'<span class="pill vir">pro</span>':""}</td>
    <td>${c.kind === "expense" ? `<span class="pill ${c.fixity==="fixe"?"vir":"warn"}">${FX[c.fixity]||"—"}</span>` : ""}</td>
    <td>${c.kind === "expense" ? `<span class="pill ${c.nature==="epargne"?"ok":c.nature==="loisir"?"dep":"rev"}">${NT[c.nature]||"—"}</span>` : ""}</td>
    <td class="num">${c.kind === "expense" ? (S.budgets[c.id] ? money(S.budgets[c.id], false, 0) : `<span class="muted">—</span>`) : ""}</td>
    <td class="num">${n}</td>
    <td style="white-space:nowrap">
      <button class="ghost sm" data-act="editCat:${c.id}">✎</button>
      <button class="ghost sm" data-act="delCat:${c.id}">🗑</button></td></tr>`;
}
function catForm(c){
  const parents = S.categories.filter(x => x.kind === c.kind && !x.parentId && x.id !== c.id);
  return `<div class="grid2">
      <label class="f"><span>Nom</span><input id="c-name" value="${esc(c.name||"")}"></label>
      <label class="f"><span>Couleur</span><input type="color" id="c-color"
        value="${c.color && c.color[0]==="#" ? c.color : "#3d6df0"}"></label>
    </div>

let IMP = null;   // état de l'assistant d'import

/** Parseur CSV : gère les guillemets, les retours à la ligne échappés et les CRLF. */
function parseCSV(text, delim = ",", quote = '"'){
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === quote){
        if (text[i+1] === quote){ field += quote; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === quote && field === "") inQ = true;
    else if (c === delim){ row.push(field); field = ""; }
    else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
    else if (c === "\r"){ /* ignoré */ }
    else field += c;
  }
  if (field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => String(f).trim() !== ""));
}
function detectDelimiter(text){
  const head = text.split("\n").slice(0, 8).join("\n");
  const cands = [";", ",", "\t", "|"];
  let best = ";", bestScore = -1;
  for (const d of cands){
    const counts = head.split("\n").filter(Boolean).map(l => l.split(d).length);
    if (counts.length < 2) continue;
    const avg = sum(counts) / counts.length;
    if (avg < 2) continue;
    const variance = sum(counts, c => (c - avg) ** 2) / counts.length;
    const score = avg - variance * 3;      // on privilégie un nombre de colonnes stable
    if (score > bestScore){ bestScore = score; best = d; }
  }
  return best;
}
/** Devine le rôle de chaque colonne à partir de l'en-tête et du contenu. */
function guessMapping(rows, hasHeader){
  const head = hasHeader ? rows[0].map(h => normLabel(h)) : [];
  const body = rows.slice(hasHeader ? 1 : 0, hasHeader ? 9 : 8);
  /* Les en-têtes se recouvrent : « Date operation » contient OPERATION, motif de la
     colonne libellé ; « Date de valeur » contient VALEUR, motif de la colonne montant.
     On attribue donc les colonnes une par une, de la moins ambiguë à la plus ambiguë,
     en excluant à chaque fois celles déjà prises. */
  const taken = new Set();
  const find = (...pats) => {
    for (const pat of pats){
      const i = head.findIndex((h, idx) => !taken.has(idx) && h.includes(pat));
      if (i >= 0){ taken.add(i); return i; }
    }
    return -1;
  };
  const m = {};
  m.date    = find("DATE", "JOUR");
  m.debit   = find("DEBIT", "RETRAIT", "SORTIE");
  m.credit  = find("CREDIT", "DEPOT", "ENTREE", "VERSEMENT");
  m.amount  = find("MONTANT", "AMOUNT", "VALEUR");
  m.balance = find("SOLDE", "BALANCE");
  m.label   = find("LIBELLE", "INTITULE", "DESCRIPTION", "MOTIF", "NATURE", "OPERATION");
  m.note    = find("NOTE", "COMMENTAIRE", "REFERENCE");
  const ncol = Math.max(...rows.map(r => r.length));
  // repli : détection par le contenu
  if (m.date < 0) for (let c = 0; c < ncol; c++)
    if (body.filter(r => parseDate(r[c])).length >= Math.max(1, body.length - 1)){ m.date = c; break; }
  if (m.amount < 0 && m.debit < 0 && m.credit < 0){
    const numeric = [];
    for (let c = 0; c < ncol; c++){
      if (c === m.date) continue;
      const ok = body.filter(r => !isNaN(parseAmount(r[c])) && String(r[c]).trim() !== "").length;
      if (ok >= Math.max(1, body.length - 1)) numeric.push(c);
    }
    if (numeric.length === 1) m.amount = numeric[0];
    else if (numeric.length >= 2){ m.debit = numeric[0]; m.credit = numeric[1]; }
  }
  if (m.label < 0) for (let c = 0; c < ncol; c++){
    if ([m.date, m.amount, m.debit, m.credit, m.balance].includes(c)) continue;
    const textish = body.filter(r => String(r[c]||"").trim().length > 4 && isNaN(parseAmount(r[c]))).length;
    if (textish >= Math.max(1, body.length - 1)){ m.label = c; break; }
  }
  const mode = (m.amount >= 0) ? "single" : "dual";
  return { mode, cols: m, ncol };
}
