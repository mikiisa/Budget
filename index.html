function initDrop(){
  const dz = $("#drop"); if (!dz) return;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  ["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => { stop(e); dz.classList.add("hot"); }));
  ["dragleave","drop"].forEach(ev => dz.addEventListener(ev, e => { stop(e); dz.classList.remove("hot"); }));
  dz.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
  const inp = $("#file");
  inp && inp.addEventListener("change", e => { const f = e.target.files[0]; if (f) loadFile(f); });
}
function loadFile(file){
  if (!S.accounts.length) return needAccount();
  const fr = new FileReader();
  fr.onload = () => {
    const buf = fr.result;
    IMP = { file: file.name, buffer: buf, encoding: "utf-8", accountId: activeAccounts()[0].id,
            presetId: "", skipRows: 0, hasHeader: true, invertSign: false, step: 1 };
    decodeAndGuess();
    render();
  };
  fr.readAsArrayBuffer(file);
}
function decodeText(){
  let text = new TextDecoder(IMP.encoding, { fatal: false }).decode(IMP.buffer);
  if (IMP.encoding === "utf-8" && /\uFFFD/.test(text.slice(0, 4000))){
    IMP.encoding = "iso-8859-1";
    text = new TextDecoder("iso-8859-1").decode(IMP.buffer);
  }
  IMP.text = text.replace(/^\uFEFF/, "");
}
/** Détection automatique complète, en repartant de zéro. */
function autoDetect(){
  IMP.presetId = ""; IMP.cols = null;
  decodeText();
  IMP.delimiter = detectDelimiter(IMP.text);
  reparse();
}
/** Proportion de lignes illisibles avec le réglage courant. */
function badRatio(){
  const rows = buildRows();
  if (!rows.length) return 1;
  return rows.filter(r => r.err).length / rows.length;
}
/** Applique un preset, mais seulement s'il sait réellement lire ce fichier :
    un format mémorisé pour une banque ne doit pas casser l'import d'une autre. */
function tryPreset(p){
  const backup = JSON.stringify({ presetId:IMP.presetId, delimiter:IMP.delimiter, encoding:IMP.encoding,
    skipRows:IMP.skipRows, hasHeader:IMP.hasHeader, mode:IMP.mode, cols:IMP.cols,
    dateFormat:IMP.dateFormat, invertSign:IMP.invertSign });
  applyPreset(p);
  if (badRatio() <= 0.5){ IMP.presetRejected = null; return true; }
  Object.assign(IMP, JSON.parse(backup));
  autoDetect();
  IMP.presetRejected = p.name;
  return false;
}
function decodeAndGuess(){
  decodeText();
  IMP.delimiter = IMP.delimiter || detectDelimiter(IMP.text);
  reparse();
  // un format mémorisé pour ce compte s'applique tout seul, s'il fonctionne
  const p = S.importPresets.find(p => p.accountId === IMP.accountId);
  if (p && !IMP.presetId) tryPreset(p);
}
function reparse(){
  IMP.rows = parseCSV(IMP.text, IMP.delimiter).slice(IMP.skipRows);
  if (!IMP.cols){
    const g = guessMapping(IMP.rows, IMP.hasHeader);
    IMP.mode = g.mode; IMP.cols = g.cols; IMP.dateFormat = "auto";
  }
}
function applyPreset(p){
  IMP.presetId = p.id; IMP.delimiter = p.delimiter; IMP.encoding = p.encoding || IMP.encoding;
  IMP.skipRows = p.skipRows; IMP.hasHeader = p.hasHeader; IMP.mode = p.mode;
  IMP.cols = { ...p.cols }; IMP.dateFormat = p.dateFormat; IMP.invertSign = p.invertSign;
  IMP.accountId = p.accountId || IMP.accountId;
  IMP.text = new TextDecoder(IMP.encoding, { fatal:false }).decode(IMP.buffer).replace(/^\uFEFF/, "");
  IMP.rows = parseCSV(IMP.text, IMP.delimiter).slice(IMP.skipRows);
}
/** Construit les transactions candidates à partir du mapping courant. */
function buildRows(){
  const body = IMP.rows.slice(IMP.hasHeader ? 1 : 0);
  const c = IMP.cols, out = [];
  const seen = new Set(S.transactions.map(t => t.fingerprint).filter(Boolean));
  const inBatch = new Set();
  for (const r of body){
    const date = parseDate(r[c.date], IMP.dateFormat);
    let amount = NaN;
    if (IMP.mode === "single") amount = parseAmount(r[c.amount]);
    else {
      const d = parseAmount(r[c.debit]), cr = parseAmount(r[c.credit]);
      if (!isNaN(cr) && Math.abs(cr) > 0) amount = Math.abs(cr);
      else if (!isNaN(d) && Math.abs(d) > 0) amount = -Math.abs(d);
    }
    if (IMP.invertSign && !isNaN(amount)) amount = -amount;
    const label = String(r[c.label] ?? "").trim() || "(sans libellé)";
    const note = c.note >= 0 ? String(r[c.note] ?? "").trim() : "";
    const err = !date ? "date illisible" : (isNaN(amount) || amount === 0 ? "montant illisible" : "");
    const fp = (!err) ? fingerprint(IMP.accountId, date, amount, label) : "";
    const dup = fp && (seen.has(fp) || inBatch.has(fp));
    if (fp) inBatch.add(fp);
    out.push({ raw:r, date, amount, label, note, err, dup, keep: !err && !dup, fingerprint: fp });
  }
  return out;
}

ACTIONS.impAcc = (_, el) => { IMP.accountId = el.value;

  if (p && p.id !== IMP.presetId) tryPreset(p);
  render(); };
ACTIONS.impPreset = (_, el) => { const p = S.importPresets.find(p => p.id === el.value);
  if (p) applyPreset(p); else autoDetect(); render(); };
ACTIONS.impAuto = () => { autoDetect(); IMP.presetRejected = null; render(); toast("Format redétecté"); };
ACTIONS.impDelim = (_, el) => { IMP.delimiter = el.value === "TAB" ? "\t" : el.value; IMP.cols = null; reparse(); render(); };
ACTIONS.impEnc = (_, el) => { IMP.encoding = el.value; IMP.cols = null; decodeAndGuess(); render(); };
ACTIONS.impSkip = (_, el) => { IMP.skipRows = Math.max(0, +el.value || 0); IMP.cols = null; reparse(); render(); };
ACTIONS.impHeader = (_, el) => { IMP.hasHeader = el.checked; IMP.cols = null; reparse(); render(); };
ACTIONS.impInvert = (_, el) => { IMP.invertSign = el.checked; render(); };
ACTIONS.impDateFmt = (_, el) => { IMP.dateFormat = el.value; render(); };
ACTIONS.impMode = m => { IMP.mode = m; render(); };
ACTIONS.impCol = (k, el) => { IMP.cols[k] = +el.value; render(); };
ACTIONS.impCheckAll = (_, el) => $$("[data-improw]").forEach(c => { if (!c.disabled) c.checked = el.checked; });
ACTIONS.impCancel = () => { IMP = null; render(); };
ACTIONS.impSavePreset = () => {
  const name = $("#imp-preset-name").value.trim();
  if (!name) return toast("Donne un nom à ce format");
  const p = { id: IMP.presetId || uid("p"), name, accountId: IMP.accountId, delimiter: IMP.delimiter,
    encoding: IMP.encoding, skipRows: IMP.skipRows, hasHeader: IMP.hasHeader, mode: IMP.mode,
    cols: { ...IMP.cols }, dateFormat: IMP.dateFormat, invertSign: IMP.invertSign };
  const i = S.importPresets.findIndex(x => x.id === p.id);
  if (i >= 0) S.importPresets[i] = p; else S.importPresets.push(p);
  IMP.presetId = p.id;
  save(); render(); toast("Format mémorisé pour ce compte");
};
ACTIONS.delPreset = id => { S.importPresets = S.importPresets.filter(p => p.id !== id); save(); render(); };
ACTIONS.impRun = () => {
  const rows = buildRows();
  const checked = new Set($$("[data-improw]").filter(c => c.checked).map(c => +c.dataset.improw));
  // au-delà des 25 lignes affichées, on suit la décision automatique
  const list = rows.filter((r, i) => i < 25 ? checked.has(i) : r.keep);
  if (!list.length) return toast("Aucune ligne sélectionnée");
  snapshot("import CSV");
  pushSnapshotHistory();
  const batch = { id: uid("b"), at: Date.now(), file: IMP.file, accountId: IMP.accountId };
  S.importBatches.push(batch);
  for (const r of list){
    const t = { id: uid("t"), accountId: IMP.accountId, date: r.date, amount: round2(r.amount),
                label: r.label, rawLabel: r.label, note: r.note, tags: [], categoryId: "",
                importBatchId: batch.id, fingerprint: r.fingerprint, needsReview: false };
    autoClassify(t);
    S.transactions.push(t);
  }
  const paired = matchTransfers({ silent: true });
  const review = S.transactions.filter(t => t.importBatchId === batch.id && t.needsReview).length;
  IMP = null; save(); go("tx");
  toast(`${list.length} ligne(s) importée(s)${paired ? `, ${paired} virement(s) apparié(s)` : ""}${review ? ` — ${review} à valider` : ""}`);
  if (review) setTimeout(() => go("review"), 900);
};
ACTIONS.undoBatch = id => {
  const n = S.transactions.filter(t => t.importBatchId === id).length;
  if (!confirm(`Retirer les ${n} transaction(s) de cet import ?`)) return;
  snapshot("annulation d'import");
  for (const t of S.transactions) if (t.importBatchId === id && t.transferPeerId){
    const p = S.transactions.find(x => x.id === t.transferPeerId); if (p) p.transferPeerId = null;
  }
  S.transactions = S.transactions.filter(t => t.importBatchId !== id);
  save(); render(); toast(`${n} ligne(s) retirée(s)`);
};

  const cmp = cur ? {
    prev: totals(S.transactions.filter(t => ymOf(t.date) === addMonths(cur, -1) && ids.includes(t.accountId))),
    year: totals(S.transactions.filter(t => ymOf(t.date) === addMonths(cur, -12) && ids.includes(t.accountId))),
    // moyenne sur les mois qui existent réellement : un mois sans données
    // tirerait la moyenne vers le bas et rendrait la comparaison trompeuse
    avg3: (() => {
      const known = new Set(S.transactions.map(t => ymOf(t.date)));
      const l = [1,2,3].map(k => addMonths(cur, -k)).filter(m => known.has(m))
        .map(m => totals(S.transactions.filter(t => ymOf(t.date) === m && ids.includes(t.accountId))));
      const n = l.length || 1;
      return { n: l.length, income: sum(l, x => x.income)/n,
               expense: sum(l, x => x.expense)/n, net: sum(l, x => x.net)/n };
    })(),
  } : null;
  const delta = (a, b) => !b ? "" : `<span class="${a>=b?"neg":"pos"}" style="font-size:.85em">
    ${a>=b?"▲":"▼"} ${pct(Math.abs((a-b)/b*100), 0)}</span>`;

/* ==========================================================================
   §11 FISCAL — onglet Pro
   Le calcul direct `computeCascade(ca, profile, rates)` descend du chiffre
   d'affaires jusqu'au revenu net. Le calcul inverse `solveForNet` remonte par
   dichotomie : la cascade est croissante en CA mais pleine de paliers (tranches
   d'IR, cotisations minimales, seuils micro et TVA), et une formule algébrique
   se tromperait à chaque franchissement.
   ========================================================================== */
function ratesFor(year){
  if (!S.taxYears) S.taxYears = defaultTaxYears();
  if (!S.taxYears[year]) S.taxYears[year] = ratesTemplate(+year);
  return S.taxYears[year];
}
function freshProfile(){
  return {
    year: String(new Date().getFullYear()),
    regime: "micro",
    activities: [{ kind: "bncSSI", share: 100 }],
    acre: { active: false, months: 12 },
    tva: { assujetti: false, rate: 20, pricing: "HT", chargesTTC: true },
    cfe: { exempt: false, manual: null, firstYear: false },
    charges: [], amortissements: 0,
    household: { parts: 1, couple: false, otherIncome: 0 },
    vfl: false,
    reelMode: "detaille",
    target: { net: 24000, basis: "apresImpot", period: "annuel", monthsWorked: 12, billableDays: 0 },
  };
}
/** Barème progressif de l'IR, quotient familial plafonné puis décote. */
function computeIR(revenuImposable, profile, rates){
  const base = Math.max(0, revenuImposable);
  const parts = Math.max(1, +profile.household.parts || 1);
  const couple = !!profile.household.couple;
  const bar = rates.ir.brackets;
  const tax = b => {
    let t = 0, prev = 0;
    for (const [lim, taux] of bar){
      const hi = lim == null ? Infinity : lim;
      if (b > prev) t += (Math.min(b, hi) - prev) * taux / 100;
      prev = hi;
      if (b <= hi) break;
    }
    return t;
  };
  let ir = tax(base / parts) * parts;
  const partsBase = couple ? 2 : 1;
  if (parts > partsBase){                       // plafonnement du quotient familial
    const irBase = tax(base / partsBase) * partsBase;
    const cap = rates.ir.plafondDemiPart * (parts - partsBase) * 2;
    if (irBase - ir > cap) ir = irBase - cap;
  }
  const seuil = couple ? rates.ir.decoteCouple : rates.ir.decoteCelib;
  const d = seuil - ir * rates.ir.decoteTaux / 100;   // décote
  if (d > 0) ir = ir - d;
  return Math.max(0, ir);
}
/** Cotisations TNS au réel, branche par branche. R = assiette (revenu professionnel). */
function tnsBranches(R, kind, rates){
  const P = rates.pass, t = rates.tns, out = [];
  const add = (label, amount) => { if (amount > 0.005) out.push({ label, amount }); };
  const progressive = (start, end, maxRate) => {
    if (R <= P * start / 100) return 0;
    if (R >= P * end / 100) return R * maxRate / 100;
    const f = (R - P * start / 100) / (P * (end - start) / 100);
    return R * (maxRate * f) / 100;
  };
  add("Maladie-maternité", progressive(t.maladieDebut, t.maladieFin, t.maladieTauxMax));
  add("Indemnités journalières",
      clamp(Math.max(R, P * t.ijAssietteMin / 100), 0, P * 5) * t.ij / 100);
  if (kind === "bncCipav"){
    const c = rates.cipav;
    add("Retraite de base (CIPAV) — tranche 1", Math.min(R, P) * c.base1 / 100);
    add("Retraite de base (CIPAV) — tranche 2", Math.min(R, P * 5) * c.base2 / 100);
    add("Retraite complémentaire (CIPAV)", R > 0 ? c.complementaireForfait : 0);
    add("Invalidité-décès (CIPAV)", R > 0 ? c.invaliditeForfait : 0);
  } else {
    add("Retraite de base — tranche 1",
        Math.max(Math.min(R, P), P * t.minRetraiteBasePct / 100) * t.retraiteBase1 / 100);
    add("Retraite de base — tranche 2", Math.max(0, R) * t.retraiteBase2 / 100);
    add("Retraite complémentaire — tranche 1", Math.min(Math.max(R, 0), t.rciPlafond1) * t.rciTaux1 / 100);
    add("Retraite complémentaire — tranche 2",
        Math.max(0, Math.min(R, P * t.rciPlafondPass) - t.rciPlafond1) * t.rciTaux2 / 100);
    add("Invalidité-décès",
        Math.max(Math.min(R, P), P * t.minInvaliditePct / 100) * t.invalidite / 100);
  }
  add("Allocations familiales", progressive(t.afDebut, t.afFin, t.afTauxMax));
  add("Formation professionnelle", P * t.cfp / 100);
  return out;
}
/** Résout l'assiette sociale : R = bénéfice − cotisations déductibles, avec cotisations = f(R). */
function solveTNS(beneficeAvantCot, kind, rates, profile){
  let R = Math.max(0, beneficeAvantCot * 0.72);
  let branches = [];
  for (let i = 0; i < 40; i++){
    branches = tnsBranches(R, kind, rates);
    let C = sum(branches, b => b.amount);
    C *= acreFactor(R, rates, profile);
    const next = Math.max(0, beneficeAvantCot - C);
    if (Math.abs(next - R) < 0.01){ R = next; break; }
    R = R + (next - R) * 0.75;                   // sous-relaxation : convergence sûre
  }
  branches = tnsBranches(R, kind, rates);
  const f = acreFactor(R, rates, profile);
  if (f < 1) branches = branches.map(b => ({ ...b, amount: b.amount * f, acre: true }));
  return { R, branches, total: sum(branches, b => b.amount), acreFactor: f };
}
/** ACRE au réel : exonération totale sous 75 % du PASS, dégressive jusqu'à 100 %. */
function acreFactor(R, rates, profile){
  if (!profile.acre?.active) return 1;
  const P = rates.pass;
  let exo = R <= P * 0.75 ? 1 : (R >= P ? 0 : (P - R) / (P * 0.25));
  const share = clamp((profile.acre.months || 12) / 12, 0, 1);
  return 1 - exo * share;
}
/** Base minimum de CFE selon la tranche de CA et la position choisie dans la fourchette. */
function cfeAmount(ca, profile, rates){
  if (profile.cfe.exempt || profile.cfe.firstYear || ca <= 5000) return 0;
  if (profile.cfe.manual != null && profile.cfe.manual !== "") return +profile.cfe.manual;
  const tr = rates.cfe.tranches.find(([lim]) => lim == null || ca <= lim) || rates.cfe.tranches.at(-1);
  const [, mn, mx] = tr;
  return mn + (mx - mn) * clamp(rates.cfe.tauxCommunal, 0, 100) / 100;
}

/** Cascade complète : d'un CA HT donné jusqu'au revenu net. */
function computeCascade(ca, profile, rates){
  ca = Math.max(0, ca);
  const r = { ca, warnings: [], lines: [], cotisationsDetail: [] };
  const acts = (profile.activities || []).filter(a => a.share > 0);
  const totShare = sum(acts, a => a.share) || 100;

  /* — TVA — */
  const tvaRate = profile.tva.assujetti ? (+profile.tva.rate || 0) : 0;
  r.caTTC = ca * (1 + tvaRate / 100);
  /* Charges : si assujetti et charges saisies TTC, la TVA est récupérée. */
  const chargesBrutes = sum(profile.charges || [], c => +c.amount || 0);
  const tvaSurCharges = (profile.tva.assujetti && profile.tva.chargesTTC)
    ? chargesBrutes - chargesBrutes / (1 + tvaRate / 100) : 0;
  r.charges = chargesBrutes - tvaSurCharges;
  r.tvaCollectee = ca * tvaRate / 100;
  r.tvaDeductible = tvaSurCharges;
  r.tvaAReverser = Math.max(0, r.tvaCollectee - r.tvaDeductible);

  /* — Cotisations, abattement, revenu imposable — */
  let cot = 0, cfp = 0, chamber = 0, abattement = 0, vflAmount = 0;
  if (profile.regime === "micro"){
    const acreShare = profile.acre.active
      ? clamp((profile.acre.months || 12) / 12, 0, 1) * (rates.acre.reduction / 100) : 0;
    for (const a of acts){
      const m = rates.micro[a.kind]; if (!m) continue;
      const part = ca * a.share / totShare;
      const c = part * m.cot / 100 * (1 - acreShare);
      cot += c; cfp += part * m.cfp / 100; chamber += part * m.chamber / 100;
      abattement += part * m.abat / 100;
      vflAmount += part * m.vfl / 100;
      r.cotisationsDetail.push({ label: `Cotisations ${ACTIVITIES[a.kind].short}`, amount: c });
      if (part > m.ceiling)
        r.warnings.push(`Le CA en ${ACTIVITIES[a.kind].short} (${money(part)}) dépasse le seuil du régime micro (${money(m.ceiling)}).`);
    }
    if (acreShare > 0) r.cotisationsDetail.forEach(d => d.acre = true);
    abattement = Math.max(Math.min(rates.abatMin, ca), abattement);
    r.abattement = abattement;
    r.benefice = Math.max(0, ca - abattement);          // « bénéfice » forfaitaire
    r.revenuImposable = r.benefice;
    r.assietteSociale = ca;
  } else {
    const benefAvant = ca - r.charges - (+profile.amortissements || 0);
    r.beneficeAvantCotisations = benefAvant;
    const kind = acts[0]?.kind || "bncSSI";
    if (profile.reelMode === "simplifie"){
      const taux = rates.reelSimplifie;
      cot = Math.max(0, benefAvant) * taux / 100;
      r.cotisationsDetail.push({ label: `Cotisations sociales (taux global ${taux} %)`, amount: cot });
      r.assietteSociale = Math.max(0, benefAvant - cot);
      r.csgDeductible = 0; r.csgNonDeductible = 0; r.crds = 0;
      r.revenuImposable = Math.max(0, benefAvant - cot);
      r.benefice = r.revenuImposable;
    } else {
      const t = solveTNS(benefAvant, kind, rates, profile);
      cot = t.total;
      r.cotisationsDetail = t.branches.map(b => ({ label: b.label, amount: b.amount, acre: b.acre }));
      r.assietteSociale = t.R;
      // CSG-CRDS sur le revenu professionnel majoré des cotisations déductibles
      const assietteCSG = Math.max(0, t.R + t.total);
      r.csgDeductible    = assietteCSG * rates.tns.csgDeductible / 100;
      r.csgNonDeductible = assietteCSG * rates.tns.csgNonDeductible / 100;
      r.crds             = assietteCSG * rates.tns.crds / 100;
      const csgTot = r.csgDeductible + r.csgNonDeductible + r.crds;
      r.cotisationsDetail.push({ label: "CSG-CRDS", amount: csgTot });
      cot += csgTot;
      r.revenuImposable = Math.max(0, t.R - r.csgDeductible);
      r.benefice = r.revenuImposable;
      if (t.acreFactor < 1) r.warnings.push("Exonération ACRE appliquée aux cotisations (hors CSG-CRDS).");
    }
    r.abattement = 0;
  }
  r.cotisations = cot; r.cfp = cfp; r.chamber = chamber;

  /* — CFE — */
  r.cfe = cfeAmount(ca, profile, rates);

  /* — Impôt sur le revenu — */
  const autres = +profile.household.otherIncome || 0;
  if (profile.regime === "micro" && profile.vfl){
    r.ir = vflAmount;
    r.irMode = "Versement libératoire";
    r.irBareme = computeIR(r.revenuImposable + autres, profile, rates) - computeIR(autres, profile, rates);
    r.warnings.push("Au versement libératoire, le revenu micro entre tout de même dans le calcul du taux effectif du foyer : l'impôt réel peut être légèrement supérieur.");
  } else {
    r.ir = computeIR(r.revenuImposable + autres, profile, rates) - computeIR(autres, profile, rates);
    r.irMode = "Barème progressif";
    if (profile.regime === "micro") r.irVfl = vflAmount;
  }
  r.ir = Math.max(0, r.ir);

  /* — Nets — */
  const chargesCash = profile.regime === "micro" ? r.charges : r.charges;
  r.netAvantImpot = ca - r.cotisations - r.cfp - r.chamber - r.cfe - chargesCash;
  r.net = r.netAvantImpot - r.ir;

  /* — Alertes de seuil — */
  if (profile.regime === "micro"){
    const svc = sum(acts.filter(a => a.kind !== "bicVente"), a => ca * a.share / totShare);
    const vte = sum(acts.filter(a => a.kind === "bicVente"), a => ca * a.share / totShare);
    if (!profile.tva.assujetti){
      if (svc > rates.tva.toleranceServices || vte > rates.tva.toleranceVente)
        r.warnings.push(`Franchise en base de TVA dépassée au-delà du seuil majoré — la TVA devient exigible.`);
      else if (svc > rates.tva.seuilServices || vte > rates.tva.seuilVente)
        r.warnings.push(`CA au-dessus du seuil de franchise en base de TVA (tolérance en cours).`);
    }
  }
  r.taux = { cotisations: ca ? r.cotisations/ca*100 : 0, ir: ca ? r.ir/ca*100 : 0,
             net: ca ? r.net/ca*100 : 0, prelevements: ca ? (r.cotisations+r.cfp+r.chamber+r.cfe+r.ir)/ca*100 : 0 };
  return r;
}

/** Dichotomie : quel CA HT faut-il pour atteindre le net visé ? */
function solveForNet(profile, targetOverride){
  const rates = ratesFor(profile.year);
  const t = profile.target;
  let target = targetOverride != null ? targetOverride : (+t.net || 0);
  if (t.period === "mensuel") target *= 12;
  const key = t.basis === "apresImpot" ? "net" : "netAvantImpot";
  if (target <= 0) return { ok:false, message:"Indique un revenu net visé supérieur à zéro." };
  const f = ca => computeCascade(ca, profile, rates)[key];
  let hi = 1000;
  // borne haute : on double jusqu'à dépasser l'objectif
  for (let i = 0; i < 40 && f(hi) < target; i++) hi *= 2;
  if (f(hi) < target)
    return { ok:false, message:"Objectif hors d'atteinte avec ces paramètres." };
  /* Certains seuils font *reculer* le net quand le CA augmente : franchir 5 000 €
     de CA déclenche la CFE, et le net retombe. La cascade n'est donc pas croissante
     partout, et une dichotomie lancée sur [0, hi] renverrait un CA inutilement élevé.
     On balaie donc d'abord grossièrement pour trouver le PREMIER franchissement,
     puis on affine par dichotomie à l'intérieur de cet intervalle. */
  const N = 240;
  let lo = 0, up = hi;
  for (let i = 1; i <= N; i++){
    const x = hi * i / N;
    if (f(x) >= target){ lo = hi * (i - 1) / N; up = x; break; }
  }
  for (let i = 0; i < 40; i++){
    const mid = (lo + up) / 2;
    if (f(mid) < target) lo = mid; else up = mid;
    if (up - lo < 0.005) break;
  }
  const ca = round2(up);
  const res = computeCascade(ca, profile, rates);
  return { ok:true, ca, res, rates, target, key };
}
/** Niveau de charges à partir duquel le régime réel devient plus avantageux. */
function breakEvenCharges(profile, ca){
  const rates = ratesFor(profile.year);
  const micro = { ...profile, regime:"micro" };
  const netMicro = computeCascade(ca, micro, rates).net;
  let lo = 0, hi = ca;
  const netReel = c => computeCascade(ca, { ...profile, regime:"reel",
    charges:[{ label:"test", amount:c }] }, rates).net;
  if (netReel(0) < netMicro) return null;            // le réel ne rattrape jamais
  for (let i = 0; i < 50; i++){
    const mid = (lo + hi) / 2;
    if (netReel(mid) > netMicro) lo = mid; else hi = mid;
  }
  return round2(lo);
}

function proObjectif(p, rates){
  const t = p.target;
  const sol = solveForNet(p);
  if (!sol.ok) return proTargetForm(p) + `<div class="note bad">${esc(sol.message)}</div>`;
  const r = sol.res;
  const annualTarget = t.period === "mensuel" ? (+t.net||0) * 12 : (+t.net||0);
  const months = Math.max(1, +t.monthsWorked || 12);
  const rows = [
    { label:"Cotisations sociales", delta:-r.cotisations, hint: p.regime === "micro" ? "URSSAF sur le CA" : "TNS sur le bénéfice" },
    { label:"Formation professionnelle", delta:-r.cfp },
    { label:"Taxe frais de chambre", delta:-r.chamber },
    { label:"Charges professionnelles", delta:-r.charges, hint: p.regime === "micro" ? "non déductibles fiscalement, mais bien décaissées" : "déductibles" },
    { label:"Cotisation foncière des entreprises", delta:-r.cfe },
    { label:`Impôt sur le revenu — ${r.irMode}`, delta:-r.ir, always:true },
  ];
  const provision = (r.cotisations + r.cfp + r.chamber + r.cfe + r.ir) / 12;
  return proTargetForm(p) + `
    <div class="grid3" style="margin:14px 0">
      <div class="stat"><div class="k">CA HT annuel nécessaire</div><div class="v">${money(sol.ca)}</div>
        <div class="s">pour ${money(annualTarget)} net ${t.basis === "apresImpot" ? "après impôt" : "avant impôt"}</div></div>
      <div class="stat"><div class="k">Par mois travaillé</div><div class="v">${money(sol.ca / months)}</div>
        <div class="s">${months} mois d'activité</div></div>
      <div class="stat"><div class="k">TJM nécessaire</div>
        <div class="v">${t.billableDays ? money(sol.ca / t.billableDays) : "—"}</div>
        <div class="s">${t.billableDays ? `${t.billableDays} jours facturables` : "renseigne tes jours facturables"}</div></div>
      ${p.tva.assujetti ? `<div class="stat"><div class="k">CA TTC à facturer</div><div class="v">${money(r.caTTC)}</div>
        <div class="s">TVA à ${p.tva.rate} % — ${money(r.tvaAReverser)} à reverser</div></div>`
      : `<div class="stat"><div class="k">Taux de prélèvement</div><div class="v">${pct(r.taux.prelevements)}</div>
        <div class="s">cotisations + impôts sur le CA</div></div>`}
    </div>
    ${r.warnings.length ? r.warnings.map(w => `<div class="note">${esc(w)}</div>`).join("") : ""}
    <div class="dash">
      <section class="card blk" data-span="7"><h3>Du chiffre d'affaires au net</h3>
        ${waterfall(rows, sol.ca)}
        <p class="muted" style="margin:10px 0 0;font-size:.88em">
          ${p.regime === "micro"
            ? `Assiette des cotisations : le CA encaissé (${money(sol.ca)}).
               Revenu imposable après abattement de ${money(r.abattement)} : <b>${money(r.revenuImposable)}</b>.`
            : `Bénéfice avant cotisations : ${money(r.beneficeAvantCotisations)}.
               Assiette sociale : ${money(r.assietteSociale)}. Revenu imposable : <b>${money(r.revenuImposable)}</b>.`}
        </p>
      </section>
      <section class="card blk" data-span="5"><h3>Détail des cotisations</h3>
        <div class="tablewrap"><table><tbody>
          ${r.cotisationsDetail.map(d => `<tr><td>${esc(d.label)}${d.acre?' <span class="pill ok">ACRE</span>':""}</td>
            <td class="num">${money(d.amount)}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${money(r.cotisations)}</b></td></tr>
        </tbody></table></div>
        <div class="sep"></div>
        <h4>À provisionner chaque mois</h4>
        <div class="stat"><div class="v">${money(provision)}</div>
          <div class="s">cotisations, impôt et CFE${p.tva.assujetti ? `, hors ${money(r.tvaAReverser/12)} de TVA` : ""}</div></div>
        ${p.tva.assujetti ? `<p class="muted" style="margin:8px 0 0;font-size:.88em">La TVA collectée n'est jamais à toi :
          mets ${money(r.tvaAReverser/12)} de côté chaque mois en plus.</p>` : ""}
      </section>
      <section class="card blk" data-span="12"><h3>Revenu net selon le chiffre d'affaires</h3>
        ${netCurve(p, rates, sol.ca)}
        <p class="muted" style="margin:8px 0 0;font-size:.88em">Les décrochages correspondent aux franchissements de seuil
          (tranches d'impôt, seuils micro et TVA, cotisations minimales).</p>
      </section>
      ${p.acre.active ? `<section class="card blk" data-span="12"><h3>Effet de l'ACRE</h3>
        ${acreCompare(p, rates, sol)}</section>` : ""}
    </div>`;
}
function proTargetForm(p){
  const t = p.target;
  return `<div class="card"><h3>Ce que je veux gagner</h3>
    <div class="grid2">
      <label class="f"><span>Revenu net voulu (€)</span>

      <label class="f"><span>Périodicité</span><select data-act="proT:period">
        <option value="annuel" ${t.period==="annuel"?"selected":""}>par an</option>
        <option value="mensuel" ${t.period==="mensuel"?"selected":""}>par mois</option></select></label>
      <label class="f"><span>Ce net s'entend</span><select data-act="proT:basis">
        <option value="apresImpot" ${t.basis==="apresImpot"?"selected":""}>après impôt sur le revenu (dans la poche)</option>
        <option value="avantImpot" ${t.basis==="avantImpot"?"selected":""}>avant impôt sur le revenu</option></select></label>
      <label class="f"><span>Mois travaillés dans l'année</span>
        <input type="number" min="1" max="12" value="${t.monthsWorked}" data-act="proT:monthsWorked"></label>

      <label class="f"><span>Année de référence</span><select data-act="proT:year">

}
ACTIONS.proT = (k, el) => {
  if (k === "year") S.pro.year = el.value;
  else if (["basis","period"].includes(k)) S.pro.target[k] = el.value;
  else S.pro.target[k] = +el.value || 0;
  save(); render();
};
/** Courbe du net en fonction du CA, avec repère sur l'objectif. */
function netCurve(p, rates, caTarget){
  const maxCa = Math.max(caTarget * 1.8, 20000);
  const pts = [];
  for (let i = 0; i <= 24; i++){
    const ca = maxCa * i / 24;
    pts.push({ x: shortNum(ca), y: round2(computeCascade(ca, p, rates).net) });
  }
  return lineChart(pts, { h:220, color:"var(--accent)" });
}
function acreCompare(p, rates, sol){
  const without = { ...p, acre: { ...p.acre, active: false } };
  const s2 = solveForNet(without);
  if (!s2.ok) return "";
  const diff = s2.ca - sol.ca;
  return `<div class="grid3">
    <div class="stat"><div class="k">CA nécessaire avec ACRE</div><div class="v">${money(sol.ca)}</div></div>
    <div class="stat"><div class="k">CA nécessaire sans ACRE</div><div class="v">${money(s2.ca)}</div></div>
    <div class="stat"><div class="k">Marche à franchir</div><div class="v neg">${money(diff, true)}</div>
      <div class="s">soit ${pct(sol.ca ? diff/sol.ca*100 : 0)} de CA en plus l'an prochain</div></div>
  </div>
  <p class="muted" style="margin:10px 0 0">À revenu net constant, il faudra facturer ${money(diff)} de plus
    une fois l'ACRE terminée. Anticipe-le dans ta tarification plutôt que de le découvrir en janvier.</p>`;
}

ACTIONS.proChImport = () => {
  const proCats = new Set(S.categories.filter(c => c.pro).map(c => c.id));
  const byCat = new Map();
  for (const t of S.transactions){
    if (yOf(t.date) !== String(S.pro.year)) continue;
    if (t.amount >= 0 || !proCats.has(t.categoryId)) continue;
    byCat.set(t.categoryId, (byCat.get(t.categoryId) || 0) + -t.amount);
  }
  if (!byCat.size) return toast(`Aucune dépense professionnelle enregistrée en ${S.pro.year}`);
  S.pro.charges = [...byCat].map(([id, amount]) => ({ label: catName(id), amount: round2(amount) }));
  save(); render(); toast(`${byCat.size} poste(s) importé(s) depuis tes transactions`);
};

function proCompare(p, rates){
  const sol = solveForNet(p);
  const ca = sol.ok ? sol.ca : 50000;
  const variants = [
    { name:"Micro", profile:{ ...p, regime:"micro", vfl:false } },
    { name:"Micro + versement libératoire", profile:{ ...p, regime:"micro", vfl:true } },
    { name:"Réel — détaillé", profile:{ ...p, regime:"reel", reelMode:"detaille" } },
    { name:"Réel — taux global", profile:{ ...p, regime:"reel", reelMode:"simplifie" } },
  ].map(v => {
    const res = computeCascade(ca, v.profile, rates);
    const inv = solveForNet(v.profile);
    return { ...v, res, caNeeded: inv.ok ? inv.ca : null };
  });
  const best = variants.reduce((a, b) => b.res.net > a.res.net ? b : a);
  const be = breakEvenCharges(p, ca);
  const chargesNow = sum(p.charges, c => +c.amount || 0);
  return `<div class="card"><h3>Comparaison à chiffre d'affaires égal — ${money(ca)} HT</h3>
      <p class="muted">Mêmes charges (${money(chargesNow)}), même foyer fiscal, même année de taux.
        Seul le régime change.</p>
      <div class="tablewrap"><table><thead><tr><th class="nosort">Régime</th>
        <th class="num nosort">Cotisations</th><th class="num nosort">Impôt</th>
        <th class="num nosort">Net après impôt</th><th class="num nosort">Taux de prélèvement</th>
        <th class="num nosort">CA pour l'objectif</th></tr></thead><tbody>
        ${variants.map(v => `<tr ${v === best ? 'style="background:color-mix(in srgb,var(--pos) 10%,transparent)"' : ""}>
          <td><b>${esc(v.name)}</b>${v === best ? ' <span class="pill ok">meilleur net</span>' : ""}</td>
          <td class="num">${money(v.res.cotisations + v.res.cfp + v.res.chamber)}</td>
          <td class="num">${money(v.res.ir)}</td>
          <td class="num"><b>${money(v.res.net)}</b></td>
          <td class="num">${pct(v.res.taux.prelevements)}</td>
          <td class="num">${v.caNeeded != null ? money(v.caNeeded) : "—"}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Point de bascule micro / réel</h3>
      ${be == null
        ? `<p>À ce niveau de chiffre d'affaires (${money(ca)}), le régime <b>micro reste plus avantageux
             quel que soit le montant de charges</b> : l'abattement forfaitaire couvre plus que tes frais réels.</p>`
        : `<p>À ${money(ca)} de CA, le régime réel devient plus intéressant que le micro à partir de
             <b>${money(be)}</b> de charges réelles annuelles, soit ${pct(ca ? be/ca*100 : 0)} du chiffre d'affaires.</p>
           <div class="bar" style="height:14px"><i style="width:${clamp(chargesNow/Math.max(be,1)*100,0,100)}%;
             background:${chargesNow>=be?"var(--pos)":"var(--accent)"}"></i></div>
           <p class="muted" style="margin:6px 0 0">Tes charges actuelles : ${money(chargesNow)} —
             ${chargesNow >= be ? "<b>au-delà du point de bascule</b>, le réel est a priori plus favorable."
               : `il t'en manque ${money(be - chargesNow)} pour que le réel devienne plus favorable.`}</p>`}
      <p class="muted" style="margin:10px 0 0;font-size:.88em">Ce point de bascule ne regarde que le net. Le passage au
        réel implique aussi une comptabilité complète, un bilan et souvent un expert-comptable — un coût à ajouter à tes
        charges avant de trancher.</p>
    </div>
    <div class="card" style="margin-top:14px"><h3>Net selon le CA, par régime</h3>
      ${(() => {
        const maxCa = Math.max(ca * 1.8, 30000), labels = [], sers = variants.map(v => ({ name:v.name, values:[] }));
        for (let i = 1; i <= 10; i++){
          const c = maxCa * i / 10;
          labels.push(shortNum(c));
          variants.forEach((v, k) => sers[k].values.push(round2(computeCascade(c, v.profile, rates).net)));
        }
        return barChart(labels, sers.map((s, i) => ({ ...s, color: paletteColor(i) })), { h:250 }) +
          `<div class="legend">${sers.map((s, i) => `<span><i style="background:${paletteColor(i)}"></i>${esc(s.name)}</span>`).join("")}</div>`;
      })()}
    </div>`;
}

function setPath(obj, path, value){
  const parts = path.split("."); let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts.at(-1)] = value;
}

/* Générateur .xlsx maison : archive ZIP en méthode « stored » (sans compression)
   + CRC32. Aucune librairie, le fichier s'ouvre dans Excel et LibreOffice.      */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStored(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  for (const f of files){
    const nameB = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const local = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                   ...u32(crc), ...u32(data.length), ...u32(data.length),
                   ...u16(nameB.length), ...u16(0)];
    parts.push(new Uint8Array(local), nameB, data);
    central.push([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                  ...u32(crc), ...u32(data.length), ...u32(data.length),
                  ...u16(nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0),
                  ...u32(offset), ...nameB]);
    offset += local.length + nameB.length + data.length;
  }
  const cd = central.flat();
  const end = [...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
               ...u32(cd.length), ...u32(offset), ...u16(0)];
  return new Blob([...parts, new Uint8Array(cd), new Uint8Array(end)],
                  { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
const xmlEsc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;" }[c]));
function sheetXML(rows){
  const colLetter = n => { let s = ""; n++; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - 1 - m) / 26; } return s; };
  const body = rows.map((row, ri) => `<row r="${ri+1}">` + row.map((cell, ci) => {
    const ref = `${colLetter(ci)}${ri+1}`;
    if (typeof cell === "number" && isFinite(cell)) return `<c r="${ref}"><v>${cell}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell)}</t></is></c>`;
  }).join("") + `</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function buildXLSX(sheets){
  const files = [
    { name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
</Types>` },
    { name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>
${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0,28))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}
</sheets></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    // feuille de styles minimale : certaines versions d'Excel la réclament
    { name:"xl/styles.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="1"><fill><patternFill patternType="none"/></fill></fills>
<borders count="1"><border/></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>
</styleSheet>` },
    ...sheets.map((s, i) => ({ name:`xl/worksheets/sheet${i+1}.xml`, data: sheetXML(s.rows) })),
  ];
  return zipStored(files);
}
function exportXLSX(){
  const txs = [...periodTx()].sort((a, b) => a.date < b.date ? -1 : 1);
  const tx = [["Date","Année","Mois","Compte","Libellé","Type","Catégorie","Fixité","Nature","Montant","Note","Tags"]];
  for (const t of txs){
    const c = catById(t.categoryId);
    tx.push([t.date, +yOf(t.date), +t.date.slice(5,7), accById(t.accountId)?.name || "",
      t.label, { income:"Revenu", expense:"Dépense", transfer:"Virement interne" }[t.type] || t.type,
      c ? catPath(c.id) : "", c?.fixity || "", c?.nature || "", round2(t.amount), t.note || "", (t.tags||[]).join(", ")]);
  }
  const ms = recentMonths(36), ids = selectedAccountIds();
  const mois = [["Mois","Revenus","Dépenses","Résultat","Taux d'épargne %"]];
  for (const m of ms){
    const T = totals(S.transactions.filter(t => ymOf(t.date) === m && ids.includes(t.accountId)));
    mois.push([m, round2(T.income), round2(T.expense), round2(T.net), round2(T.savingRate)]);
  }
  const cats = [["Catégorie","Type","Fixité","Nature","Budget mensuel","Dépensé sur la période"]];
  for (const c of S.categories){
    const used = sum(periodTx().filter(t => t.categoryId === c.id), t => Math.abs(t.amount));
    cats.push([catPath(c.id), c.kind === "income" ? "Revenu" : "Dépense", c.fixity || "", c.nature || "",
               S.budgets[c.id] || 0, round2(used)]);
  }
  const comptes = [["Compte","Type","Solde initial","Solde actuel","Nombre de lignes","Mots-clés"]];
  for (const a of S.accounts)
    comptes.push([a.name, a.type || "", round2(a.initialBalance||0), round2(accountBalance(a.id)),
                  S.transactions.filter(t => t.accountId === a.id).length, (a.keywords||[]).join(", ")]);
  const sheets = [{ name:"Transactions", rows:tx }, { name:"Résumé mensuel", rows:mois },
                  { name:"Catégories", rows:cats }, { name:"Comptes", rows:comptes }];
  if (S.pro){
    const sol = solveForNet(S.pro);
    const pro = [["Paramètre","Valeur"]];
    pro.push(["Année de taux", S.pro.year], ["Régime", S.pro.regime === "micro" ? "Micro-entreprise" : "Régime réel"],
      ["Activité principale", ACTIVITIES[S.pro.activities[0].kind].label],
      ["Net visé", round2(S.pro.target.net)], ["Base", S.pro.target.basis === "apresImpot" ? "après impôt" : "avant impôt"]);
    if (sol.ok){
      const r = sol.res;
      pro.push([], ["Résultat", ""], ["CA HT nécessaire", round2(sol.ca)],
        ["Cotisations sociales", round2(r.cotisations)], ["Formation professionnelle", round2(r.cfp)],
        ["Taxe de chambre", round2(r.chamber)], ["CFE", round2(r.cfe)],
        ["Charges professionnelles", round2(r.charges)], ["Impôt sur le revenu", round2(r.ir)],
        ["Revenu net", round2(r.net)], ["Taux de prélèvement %", round2(r.taux.prelevements)],
        [], ["Avertissement", "Taux préchargés à vérifier — simulateur indicatif, pas un conseil fiscal."]);
      pro.push([], ["Détail des cotisations", ""]);
      for (const d of r.cotisationsDetail) pro.push([d.label, round2(d.amount)]);
    }
    sheets.push({ name:"Objectif pro", rows:pro });
  }
  download(buildXLSX(sheets), `budget-${todayISO()}.xlsx`);
  toast("Fichier Excel généré");
}

const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pwd, salt){
  const base = await crypto.subtle.importKey("raw", te.encode(pwd), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:250000, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptJSON(json, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, te.encode(json));
  return JSON.stringify({ v:1, salt:CRYPTO_SALT, iv:b64(iv), data:b64(ct) });
}
let CRYPTO_SALT = null;
async function tryUnlock(pwd){
  const raw = localStorage.getItem(KEY_ENC); if (!raw) return false;
  const pack = JSON.parse(raw);
  CRYPTO_SALT = pack.salt;
  const key = await deriveKey(pwd, unb64(pack.salt));
  try {
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(pack.iv) }, key, unb64(pack.data));
    S = JSON.parse(td.decode(plain));
    CRYPTO_KEY = key;
    return true;
  } catch { return false; }
}

function migrate(data){
  const base = freshState();
  const s = { ...base, ...data };
  s.settings = { ...base.settings, ...(data.settings || {}) };
  s.settings.regularity = { ...base.settings.regularity, ...(data.settings?.regularity || {}) };
  s.settings.transferMatch = { ...base.settings.transferMatch, ...(data.settings?.transferMatch || {}) };
  s.settings.period = { ...base.settings.period, ...(data.settings?.period || {}) };
  s.theme = { ...base.theme, ...(data.theme || {}) };
  s.meta = { ...base.meta, ...(data.meta || {}) };
  s.layout = data.layout?.blocks?.length ? data.layout : base.layout;
  // un bloc ajouté par une version ultérieure doit apparaître chez les anciens utilisateurs
  for (const b of DEFAULT_BLOCKS)
    if (!s.layout.blocks.some(x => x.id === b.id)) s.layout.blocks.push({ ...b });
  s.taxYears = data.taxYears || defaultTaxYears();
  for (const y of ["2025","2026","2027"]) if (!s.taxYears[y]) s.taxYears[y] = ratesTemplate(+y);
  if (s.pro) s.pro = { ...freshProfile(), ...s.pro,
    target: { ...freshProfile().target, ...(s.pro.target || {}) },
    tva: { ...freshProfile().tva, ...(s.pro.tva || {}) },
    cfe: { ...freshProfile().cfe, ...(s.pro.cfe || {}) },
    acre: { ...freshProfile().acre, ...(s.pro.acre || {}) },
    household: { ...freshProfile().household, ...(s.pro.household || {}) } };
  for (const t of s.transactions){
    if (!t.type) t.type = t.amount >= 0 ? "income" : "expense";
    if (!t.tags) t.tags = [];
  }
  return s;
}

function boot(){
  const enc = localStorage.getItem(KEY_ENC);
  if (enc){ $("#lock").classList.remove("hide"); $("#lockPwd").focus(); return; }
  const raw = localStorage.getItem(KEY);
  let first = false;
  if (raw){
    try { S = migrate(JSON.parse(raw)); }
    catch { S = freshState(); S.taxYears = defaultTaxYears(); first = true; }
  } else { S = freshState(); S.taxYears = defaultTaxYears(); first = true; }
  start(first);
}
function start(first){
  $("#app").hidden = false;
  const h = location.hash.slice(1);
  if (VIEWS[h]) VIEW = h;
  render();
  if (first) welcome();
}
$("#lockGo").addEventListener("click", async () => {
  const ok = await tryUnlock($("#lockPwd").value);
  if (!ok) return $("#lockErr").classList.remove("hide");
  const key = CRYPTO_KEY; S = migrate(S); CRYPTO_KEY = key;
  $("#lock").classList.add("hide");
  start(false);
});
$("#lockPwd").addEventListener("keydown", e => { if (e.key === "Enter") $("#lockGo").click(); });
$("#lockReset").addEventListener("click", () => {
  if (!confirm("Effacer définitivement les données chiffrées de ce navigateur ?")) return;
  localStorage.clear(); location.reload();
});

$("#nav").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (b) go(b.dataset.view);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !/input|textarea|select/i.test(e.target.tagName)){
    e.preventDefault(); return undo();
  }
  if (/input|textarea|select/i.test(e.target.tagName) || $("#modals").children.length) return;
  if (e.key === "n"){ e.preventDefault(); ACTIONS.newTx(); }
  else if (e.key === "/"){ e.preventDefault(); go("tx"); setTimeout(() => $('[data-act="filt:q"]')?.focus(), 60); }
  else if (/^[1-9]$/.test(e.key)){
    const tabs = $$("#nav .tab"); const t = tabs[+e.key - 1]; if (t) go(t.dataset.view);
  }
});
// Les vues sont ré-affichées à chaque render : on rebranche ce qui a besoin du DOM.
const _render = render;
render = function(){ _render(); initDashDnD(); initDrop(); };

boot();
</script>
